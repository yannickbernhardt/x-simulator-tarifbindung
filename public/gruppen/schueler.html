<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Herzblatt – Gruppenwahl</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root { --kreide: #edf2f5; --tafel: #12324a; --muted: #5c6f7e; --linie: #d3dde4; --blitz: #ffc531; --herz: #e5412d; --holz: #d9a066; --holz-dunkel: #a8743f; }
* { box-sizing: border-box; }
body { min-height: 100vh; }
html, body { margin: 0; background: var(--kreide); color: var(--tafel); font-family: "Bricolage Grotesque", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
main { max-width: 480px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); display: grid; gap: 14px; }
h1 { font-size: 30px; line-height: 1.08; margin: 0; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 22px; line-height: 1.15; margin: 0; font-weight: 800; }
p { margin: 0; font-size: 17px; line-height: 1.45; }
.leise { color: var(--muted); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blitz); outline-offset: 2px; }
.knopf { font-size: 19px; font-weight: 800; border: none; border-radius: 14px; padding: 15px 16px; background: var(--tafel); color: #fff; width: 100%; }
.knopf:disabled { opacity: .45; }
.knopf.hell { background: #fff; color: var(--tafel); border: 2px solid var(--linie); }
.link { background: none; border: none; color: var(--muted); font-size: 16px; font-weight: 600; text-decoration: underline; padding: 6px 0; justify-self: start; }
.kopfzeile { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--herz); }
.fehler { color: #8c2a1c; font-weight: 600; }
input.name { font: inherit; font-size: 24px; font-weight: 800; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; color: var(--tafel); width: 100%; }

/* Figur */
.figurbox { display: grid; place-items: center; }
.figurbox svg { width: 190px; height: 239px; }
.mini svg, svg.mini { width: 40px; height: 50px; display: block; flex-shrink: 0; }
.figur .propeller { animation: dreh 1.2s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }

/* Identität */
.ausweis { background: #fff; border: 2px solid var(--linie); border-radius: 22px; padding: 18px 16px 20px; text-align: center; display: grid; gap: 8px; box-shadow: 0 4px 0 rgba(18,50,74,.08); }
.ausweis .name { font-size: 30px; line-height: 1.1; font-weight: 800; overflow-wrap: break-word; }
.psst { background: var(--tafel); color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.35; }
.psst b { font-size: 26px; }

/* Fragen */
.fortschritt { display: flex; gap: 6px; }
.fortschritt i { flex: 1; height: 6px; border-radius: 3px; background: var(--linie); }
.fortschritt i.an { background: var(--tafel); }
.frage { font-size: 27px; line-height: 1.12; font-weight: 800; }
.spass { display: inline-block; justify-self: start; background: var(--blitz); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 800; }
.antworten { display: grid; gap: 10px; }
.antwort { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 2px solid var(--linie); border-radius: 16px; padding: 13px 14px; font-size: 18px; font-weight: 600; color: var(--tafel); line-height: 1.25; }
.antwort .e { font-size: 30px; width: 38px; text-align: center; flex-shrink: 0; }
.antwort.an { border-color: var(--tafel); background: var(--tafel); color: #fff; }

/* Profil-Chips */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; gap: 4px; align-items: center; background: var(--kreide); border-radius: 999px; padding: 2px 9px 2px 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.spass { background: #fff4d1; }

/* Ich-Leiste */
.ich { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--linie); border-radius: 16px; padding: 8px 12px; }
.ich .wer { min-width: 0; }
.ich .wer small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.ich .wer b { display: block; font-size: 18px; line-height: 1.15; overflow-wrap: break-word; }

/* ---------- Raum ---------- */
.raum { position: relative; width: 100%; user-select: none; -webkit-user-select: none; }
.zelle { --t: var(--tafel); position: absolute; background: #fff; border: 2px solid var(--linie); border-radius: 14px; cursor: pointer; transition: border-color .2s, box-shadow .2s, background .2s; }
.zelle .zk { display: flex; align-items: center; gap: 6px; padding: 5px 8px 0; font-size: 14px; font-weight: 800; }
.zelle .tnr { background: var(--t); color: #fff; border-radius: 7px; padding: 0 7px; }
.zelle .tz { color: var(--muted); font-variant-numeric: tabular-nums; }
.zelle .tz.voll { color: var(--t); }
.zelle.gewaehlt { border-color: var(--t); box-shadow: 0 0 0 3px color-mix(in srgb, var(--t) 30%, transparent); }
.zelle.ziel { border-color: var(--t); background: color-mix(in srgb, var(--t) 10%, #fff); box-shadow: 0 0 0 4px color-mix(in srgb, var(--t) 45%, transparent); }
.zelle.ziel-voll { border-color: #8c2a1c; background: #fbe9e6; }
.tischbild, .stuhl { position: absolute; pointer-events: none; }
.tischbild { z-index: 3; }
.stuhl { transition: opacity .3s; }
.stuhl.hinten { z-index: 2; } .stuhl.vorn { z-index: 4; }
.stuhl.besetzt { opacity: 0; }
.eingang { position: absolute; left: 0; right: 0; border: 3px dashed #c3d0d9; border-radius: 14px; cursor: pointer; }
.eingang .lab { position: absolute; right: 10px; top: 6px; font-size: 13px; font-weight: 800; color: var(--muted); }
.eingang.ziel { border-color: var(--tafel); background: #fff; }
.eingang.gewaehlt { border-color: var(--tafel); }
.fig { position: absolute; left: 0; top: 0; width: 100px; height: 125.45px; transform-origin: 0 0; z-index: 4; }
.fig .innen { width: 100%; height: 100%; }
.fig svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fig.gleitet { transition: transform var(--dauer, 1s) cubic-bezier(.42,.08,.58,.96); }
.fig.laeuft .glied { transform-box: view-box; }
.fig .a1 { transform-origin: 25px 74px; } .fig .a2 { transform-origin: 75px 74px; }
.fig .b1 { transform-origin: 40px 104px; } .fig .b2 { transform-origin: 60px 104px; }
.fig .glied { transform-box: view-box; }
.fig.laeuft .b1, .fig.laeuft .a2 { animation: schwing .28s ease-in-out infinite alternate; }
.fig.laeuft .b2, .fig.laeuft .a1 { animation: schwing .28s ease-in-out infinite alternate-reverse; }
.fig.laeuft .innen { animation: wipp .14s ease-in-out infinite alternate; }
@keyframes schwing { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes wipp { to { transform: translateY(-5px); } }
.fig.ich-fig { touch-action: none; cursor: grab; }
.fig.ich-fig::before { content: ""; position: absolute; inset: -6% -14% -2%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,197,49,.9), rgba(255,197,49,0)); z-index: -1; }
.fig.ich-fig .du { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); background: var(--tafel); color: #fff; font-weight: 800; font-size: 26px; border-radius: 10px; padding: 0 9px; white-space: nowrap; }
.fig.ich-fig .du::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--tafel); }
.fig.ich-fig.zieht, .fig.ich-fig.gleitet { cursor: grabbing; z-index: 10 !important; }
.fig.wackelt .innen { animation: wackel .45s ease-in-out; }
@keyframes wackel { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@media (prefers-reduced-motion: reduce) { .fig.laeuft .glied, .fig.laeuft .innen, .figur .propeller, .fig.wackelt .innen { animation: none; } }
.hinweis { background: var(--tafel); color: #fff; border-radius: 14px; padding: 10px 14px; font-size: 16px; line-height: 1.35; display: flex; gap: 10px; align-items: center; }
.hinweis b { font-size: 22px; }

/* Tischkarte */
.tisch { --t: var(--tafel); background: #fff; border: 2px solid var(--linie); border-left: 8px solid var(--t); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.tisch.meiner { border-color: var(--t); }
.tkopf { display: flex; align-items: baseline; gap: 10px; }
.tkopf h2 { color: var(--t); }
.tkopf .frei { margin-left: auto; font-size: 15px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.spruch { font-size: 15px; font-weight: 800; background: var(--kreide); border-radius: 10px; padding: 4px 10px; justify-self: start; }
.gesucht { font-size: 15px; color: var(--muted); }
.gesucht b { color: var(--tafel); }
.leute { display: grid; gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; }
.person .text { min-width: 0; display: grid; gap: 3px; }
.person .pname { font-size: 16px; font-weight: 800; line-height: 1.2; }
.person .klar { font-size: 22px; line-height: 1.1; font-weight: 800; }
.person .klar + .pname { font-size: 14px; color: var(--muted); font-weight: 600; }
.person .du { background: var(--t); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; vertical-align: 2px; }
.leer { color: var(--muted); font-size: 15px; }
.tisch .knopf { padding: 12px; font-size: 17px; background: var(--t); }
.tisch .knopf.hell { background: #fff; color: var(--tafel); }
.gross { text-align: center; display: grid; gap: 6px; padding: 4px 0; }
.gross .zahl { font-size: 88px; line-height: 1; font-weight: 800; color: var(--t, var(--tafel)); }
#netz { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #8c2a1c; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 15px; display: none; text-align: center; z-index: 20; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="leise">Einen Moment …</p></main>
<div id="netz">Keine Verbindung. Es wird weiter versucht …</div>

<script type="module">
import { FRAGEN, ANTWORT, nochGesucht, tischSpruch, TISCHFARBEN } from "/gruppen/daten.js";
import { figurSvg } from "/gruppen/figur.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = location.pathname.split("/").filter(Boolean)[1];
const speicher = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, weg(k) { try { localStorage.removeItem(k); } catch {} } };
const app = $("#app");
const H_FIG = 1.2545;

let pid = speicher.get("gruppen-" + code);
let ich = null; // { fid, name, vorname, aussehen, profil }
let stand = null, sig = "";
let ansicht = null; // "name" | "ausweis" | "fragen" | null (dann entscheidet die Phase)
let frageNr = 0, entwurf = {};
let meldung = "", letztesHtml = "";
let auswahl = null; // gewählter Tisch (Zahl) oder "eingang" für die Karte unter dem Raum

async function api(aktion, body) {
  const r = await fetch(`/api/gruppen/${code}/${aktion}`, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Fehler " + r.status), { status: r.status, daten: j });
  return j;
}
function zeigeHtml(html) {
  raumWeg();
  if (html !== letztesHtml) { letztesHtml = html; app.innerHTML = html; }
}

/* ---------- Start: Raum prüfen, dann mit gespeicherter ID wieder rein oder Vornamen abfragen ---------- */
async function starten() {
  try {
    const j = await api("stand");
    stand = j; sig = j.sig;
  } catch (e) {
    if (e.status === 404) return zeigeHtml(`<h1>Diesen Raum gibt es nicht (mehr).</h1><p class="leise">Schau noch einmal auf den Code am Beamer.</p><a class="knopf" style="text-align:center;text-decoration:none" href="/gruppen">Code eingeben</a>`);
    return setTimeout(starten, 1500);
  }
  if (pid) {
    try { return angemeldet(await api("beitreten", { pid })); }
    catch (e) { if (!e.daten?.brauchtName) return setTimeout(starten, 1200); speicher.weg("gruppen-" + code); pid = null; }
  }
  if (stand.raum.phase === "aufloesen") return zeigeHtml(`<h1>Die Gruppenwahl ist schon vorbei.</h1><p class="leise">Sag deiner Lehrkraft Bescheid.</p>`);
  ansicht = "name";
  zeigeHtml(nameHtml());
  $("#vorname")?.focus();
}
function angemeldet(j) {
  pid = j.pid; speicher.set("gruppen-" + code, pid);
  ich = { fid: j.fid, name: j.name, vorname: j.vorname, aussehen: j.aussehen, profil: j.profil };
  entwurf = { ...(ich.profil ?? {}) };
  ansicht = ich.profil ? null : speicher.get("gruppen-gesehen-" + code) === pid ? "fragen" : "ausweis";
  letztesHtml = "";
  darstellen();
  holen();
}
function nameHtml() {
  return `<div class="kopfzeile">Herzblatt · Gruppenwahl</div>
    <h1>Wie heißt du?</h1>
    <form id="nameForm" style="display:grid;gap:12px">
      <input class="name" id="vorname" name="vorname" maxlength="20" autocomplete="given-name" autocapitalize="words" placeholder="Vorname" required>
      <p class="leise">Nur dein Vorname. Er bleibt geheim und steht erst ganz am Ende am Beamer unter deiner Figur.</p>
      ${meldung ? `<p class="fehler">${esc(meldung)}</p>` : ""}
      <button class="knopf">Geheime Identität holen</button>
    </form>`;
}
app.addEventListener("submit", async (e) => {
  if (e.target.id !== "nameForm") return;
  e.preventDefault();
  const knopf = e.target.querySelector("button");
  knopf.disabled = true;
  try { angemeldet(await api("beitreten", { vorname: $("#vorname").value })); meldung = ""; }
  catch (err) { meldung = err.message; knopf.disabled = false; letztesHtml = ""; const v = $("#vorname").value; zeigeHtml(nameHtml()); $("#vorname").value = v; }
});

/* ---------- Stand holen ---------- */
let fehlZaehler = 0, holT;
async function holen() {
  clearTimeout(holT);
  if (!document.hidden) {
    try {
      const j = await api(`stand?sig=${encodeURIComponent(sig)}`);
      fehlZaehler = 0; $("#netz").style.display = "none";
      if (!j.gleich) {
        stand = j; sig = j.sig;
        const meinStand = stand.leute.find((p) => p.fid === ich.fid);
        if (meinStand) ich.profil = meinStand.profil ?? ich.profil;
        darstellen();
      }
    } catch (e) {
      if (++fehlZaehler > 3) $("#netz").style.display = "block";
    }
  }
  holT = setTimeout(holen, stand?.raum.phase === "wahl" ? 1200 : 2000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && ich) holen(); });

/* ---------- Bausteine ---------- */
function chips(p) {
  if (!p) return `<span class="leer">füllt noch das Profil aus …</span>`;
  return `<div class="chips">${FRAGEN.map((f) => {
    const a = ANTWORT[f.id][p[f.id]];
    return a ? `<span class="chip${f.art === "spass" ? " spass" : ""}">${a.e} ${esc(a.kurz)}</span>` : "";
  }).join("")}</div>`;
}
function person(p, farbe, mitKlarnamen) {
  const du = p.fid === ich.fid ? `<span class="du" style="background:${farbe}">du</span>` : "";
  const kopf = mitKlarnamen && p.vorname
    ? `<div class="klar">${esc(p.vorname)}${du}</div><div class="pname">${esc(p.name)}</div>`
    : `<div class="pname">${esc(p.name)}${du}</div>`;
  return `<div class="person"><span class="mini">${figurSvg(p.aussehen, { getraenk: p.profil?.getraenk })}</span>
    <div class="text">${kopf}${chips(p.profil)}</div></div>`;
}
const amTisch = (t) => stand.leute.filter((p) => p.tisch === t).sort((a, b) => a.platz - b.platz);
const meinTisch = () => stand.leute.find((p) => p.fid === ich.fid)?.tisch ?? null;
function ichLeiste(text) {
  return `<div class="ich"><span class="mini">${figurSvg(ich.aussehen, { getraenk: ich.profil?.getraenk })}</span>
    <div class="wer"><small>${esc(text)}</small><b>${esc(ich.name)}</b></div></div>`;
}
function tischKarte(t, knoepfe, mitKlarnamen) {
  const r = stand.raum, leute = amTisch(t), farbe = TISCHFARBEN[t - 1];
  const meiner = meinTisch() === t, voll = leute.length >= r.plaetze;
  const profile = leute.map((p) => p.profil);
  const spruch = tischSpruch(profile), gesucht = leute.length ? nochGesucht(profile) : [];
  let knopf = "";
  if (knoepfe) knopf = meiner ? `<button class="knopf hell" data-tisch="0">Hier sitzt du ✓ · aufstehen</button>` : voll ? "" : `<button class="knopf" data-tisch="${t}">Hierhin laufen</button>`;
  return `<section class="tisch${meiner ? " meiner" : ""}" style="--t:${farbe}">
    <div class="tkopf"><h2>Tisch ${t}</h2><span class="frei">${voll ? "voll" : `${r.plaetze - leute.length} ${r.plaetze - leute.length === 1 ? "Platz" : "Plätze"} frei`}</span></div>
    ${spruch ? `<div class="spruch">${esc(spruch)}</div>` : ""}
    <div class="leute">${leute.map((p) => person(p, farbe, mitKlarnamen)).join("") || `<span class="leer">Noch niemand. Sei die erste Figur!</span>`}</div>
    ${gesucht.length && !voll ? `<div class="gesucht">Noch gesucht: <b>${gesucht.map((g) => ANTWORT.rolle[g].e + " " + ANTWORT.rolle[g].kurz).join(" · ")}</b></div>` : ""}
    ${knopf}</section>`;
}

/* ---------- Ansichten ohne Raum ---------- */
function ausweisHtml() {
  return `<div class="kopfzeile">Deine geheime Identität</div>
    <div class="ausweis"><div class="figurbox">${figurSvg(ich.aussehen)}</div><div class="name">${esc(ich.name)}</div></div>
    <div class="psst"><b>🤫</b><span>Zeig das niemandem! Handy flach halten. Erst ganz am Ende wird aufgelöst, wer wer ist.</span></div>
    <button class="knopf" data-a="weiter">Weiter zum Profil</button>`;
}
function frageHtml() {
  const f = FRAGEN[frageNr];
  return `<div class="fortschritt">${FRAGEN.map((_, i) => `<i class="${i <= frageNr ? "an" : ""}"></i>`).join("")}</div>
    ${ichLeiste(`Frage ${frageNr + 1} von ${FRAGEN.length}`)}
    ${f.art === "spass" ? `<span class="spass">Spaßfrage</span>` : ""}
    <div class="frage">${esc(f.frage)}</div>
    <div class="antworten">${f.antworten.map((a) => `<button class="antwort${entwurf[f.id] === a.id ? " an" : ""}" data-antwort="${a.id}"><span class="e">${a.e}</span><span>${esc(a.text)}</span></button>`).join("")}</div>
    ${frageNr > 0 ? `<button class="link" data-a="zurueck">‹ Vorige Frage</button>` : ""}
    ${meldung ? `<p class="fehler">${esc(meldung)}</p>` : ""}`;
}
function aufgeloestHtml() {
  const t = meinTisch();
  if (!t) return `<div class="kopfzeile">Aufgelöst!</div>${ichLeiste(`Das bist du, ${ich.vorname}`)}<p class="leise">Du sitzt an keinem Tisch. Sag deiner Lehrkraft Bescheid.</p>`;
  return `<div class="kopfzeile">Aufgelöst! 🎉</div>
    <div class="gross" style="--t:${TISCHFARBEN[t - 1]}"><p class="leise">Deine Gruppe</p><div class="zahl">Tisch ${t}</div></div>
    ${tischKarte(t, false, true)}
    <p class="leise" style="text-align:center">Ab an euren Tisch!</p>`;
}

/* ---------- Raum: Tische und Eingang, die eigene Figur lässt sich an einen Tisch ziehen ---------- */
let R = null; // aufgebauter Raum
function raumWeg() { if (R) { R = null; } }

function raumMass(n, P, W) {
  const gap = 10, cols = 2, rows = Math.ceil(n / 2);
  const cw = (W - gap) / 2, kopfH = 26, szeneH = 100, ch = kopfH + szeneH + 4;
  const nb = Math.ceil(P / 2), nf = P - nb;
  const f = Math.min(szeneH / 2.15, (cw / (Math.max(nb, nf * 1.3) + 0.5)) * 0.95, 46);
  const tw = Math.min(cw * 0.86, Math.max(nb * f * 1.12 + f * 0.5, f * 2.2));
  const th = Math.min(tw * 0.3, f * 0.62);
  const tische = [];
  for (let t = 0; t < n; t++) {
    const c = t % cols, r = Math.floor(t / cols);
    const x = n % 2 === 1 && t === n - 1 ? (W - cw) / 2 : c * (cw + gap), y = r * (ch + gap);
    const cx = x + cw / 2;
    const hoehe = 0.55 * th + 1.8 * f;
    const szeneOben = y + kopfH + Math.max(0, (szeneH - hoehe) / 2);
    const tischOben = szeneOben + H_FIG * f - 0.45 * th;
    const sb = Math.min(f, (tw * 0.9) / nb), sf = nf ? Math.min(f * 1.3, (cw * 0.94) / nf) : 0;
    const plaetze = [];
    for (let i = 0; i < nb; i++) plaetze.push({ x: cx + (i - (nb - 1) / 2) * sb, fuss: tischOben + th * 0.45, hinten: true });
    for (let j = 0; j < nf; j++) plaetze.push({ x: cx + (j - (nf - 1) / 2) * sf, fuss: tischOben + th + 0.55 * f, hinten: false });
    tische.push({ x, y, cw, ch, cx, tischOben, tw, th, plaetze });
  }
  const eingangOben = rows * (ch + gap), eingangH = 96;
  return { W, f, tische, eingangOben, eingangH, hoehe: eingangOben + eingangH };
}

function raumAufbauen() {
  const r = stand.raum;
  app.innerHTML = `<div id="rKopf"></div><div class="raum" id="raum"></div><div id="rHinweis"></div><div id="karte"></div><button class="link" data-a="aendern">Profil ändern</button>`;
  letztesHtml = "";
  const raum = $("#raum");
  const M = raumMass(r.tische, r.plaetze, raum.clientWidth);
  raum.style.height = M.hoehe + "px";
  let html = "";
  M.tische.forEach((T, i) => {
    const farbe = TISCHFARBEN[i];
    html += `<div class="zelle" data-zelle="${i + 1}" style="left:${T.x}px;top:${T.y}px;width:${T.cw}px;height:${T.ch}px;--t:${farbe}"><div class="zk"><span class="tnr">Tisch ${i + 1}</span><span class="tz"></span></div></div>`;
    const kante = T.th * 0.2;
    html += `<div class="tischbild" style="left:${T.cx - T.tw / 2}px;top:${T.tischOben}px"><svg width="${T.tw}" height="${T.th + kante}" viewBox="0 0 ${T.tw} ${T.th + kante}"><ellipse cx="${T.tw / 2}" cy="${T.th / 2 + kante}" rx="${T.tw / 2 - 1}" ry="${T.th / 2}" fill="var(--holz-dunkel)"/><ellipse cx="${T.tw / 2}" cy="${T.th / 2}" rx="${T.tw / 2 - 1}" ry="${T.th / 2}" fill="var(--holz)"/></svg></div>`;
    T.plaetze.forEach((p, j) => {
      const w = M.f * 0.62, h = p.hinten ? M.f * 0.9 : M.f * 0.55;
      html += `<div class="stuhl ${p.hinten ? "hinten" : "vorn"}" data-stuhl="${i + 1}-${j}" style="left:${p.x - w / 2}px;top:${p.fuss - h}px">${p.hinten
        ? `<svg width="${w}" height="${h}" viewBox="0 0 62 90"><rect x="6" y="2" width="50" height="70" rx="12" fill="#c7d3dc"/></svg>`
        : `<svg width="${w}" height="${h}" viewBox="0 0 62 55"><rect x="2" y="4" width="58" height="14" rx="7" fill="#c7d3dc"/><path d="M12 18 L8 53 M50 18 L54 53" stroke="#c7d3dc" stroke-width="6" stroke-linecap="round"/></svg>`}</div>`;
    });
  });
  html += `<div class="eingang" data-zelle="eingang" style="top:${M.eingangOben}px;height:${M.eingangH}px"><span class="lab">Eingang</span></div>`;
  raum.innerHTML = html;
  R = { M, key: `${r.tische}.${r.plaetze}.${raum.clientWidth}`, fig: new Map(), raum, ziehen: null, meinZiel: null };
}

/* Wo steht eine Figur? */
function ziel(p, eingangsListe) {
  const M = R.M, istIch = p.fid === ich.fid;
  const ort = istIch && R.meinZiel ? R.meinZiel : p;
  if (ort.tisch && M.tische[ort.tisch - 1]?.plaetze[ort.platz]) {
    const pl = M.tische[ort.tisch - 1].plaetze[ort.platz];
    return { x: pl.x - M.f / 2, y: pl.fuss - M.f * H_FIG, s: M.f / 100, z: pl.hinten ? 2 : 4 };
  }
  if (istIch) { const g = 52; return { x: 34 - g / 2 + 14, y: M.eingangOben + M.eingangH - 8 - g * H_FIG, s: g / 100, z: 9 }; }
  const andere = eingangsListe.filter((f) => f !== ich.fid);
  const i = andere.indexOf(p.fid), n = andere.length, g = 30;
  const links = 92, breite = M.W - links - 12;
  const abstand = Math.min(34, breite / Math.max(1, n));
  return { x: links + i * abstand, y: M.eingangOben + M.eingangH - 8 - g * H_FIG, s: g / 100, z: 4 };
}
function setzeFigur(e, z, gleiten) {
  const t = `translate(${z.x.toFixed(1)}px, ${z.y.toFixed(1)}px) scale(${z.s.toFixed(4)})`;
  const alt = e.ziel;
  e.ziel = z;
  if (!gleiten || !alt) { e.el.classList.remove("gleitet", "laeuft"); e.el.style.transform = t; return; }
  if (Math.abs(alt.x - z.x) < 0.5 && Math.abs(alt.y - z.y) < 0.5 && Math.abs(alt.s - z.s) < 0.001) return;
  const dauer = Math.min(1.8, Math.max(0.45, Math.hypot(alt.x - z.x, alt.y - z.y) / 260));
  e.el.style.setProperty("--dauer", dauer + "s");
  e.el.classList.add("gleitet", "laeuft");
  e.el.style.transform = t;
  clearTimeout(e.t);
  e.t = setTimeout(() => e.el.classList.remove("gleitet", "laeuft"), dauer * 1000 + 50);
}
function raumAktualisieren() {
  const r = stand.raum, M = R.M;
  const sichtbar = stand.leute;
  const eingang = sichtbar.filter((p) => {
    const ort = p.fid === ich.fid && R.meinZiel ? R.meinZiel : p;
    return !ort.tisch || !M.tische[ort.tisch - 1]?.plaetze[ort.platz];
  }).map((p) => p.fid);
  const da = new Set();
  for (const p of sichtbar) {
    da.add(p.fid);
    let e = R.fig.get(p.fid), neu = false;
    if (!e) {
      const el = document.createElement("div");
      el.className = "fig" + (p.fid === ich.fid ? " ich-fig" : "");
      el.dataset.fid = p.fid;
      el.innerHTML = `<div class="innen"></div>${p.fid === ich.fid ? `<span class="du">du</span>` : ""}`;
      R.raum.appendChild(el);
      e = { el }; R.fig.set(p.fid, e); neu = true;
    }
    const denkt = !p.profil;
    const k = JSON.stringify([p.aussehen, p.profil?.getraenk, denkt]);
    if (e.k !== k) { e.k = k; e.el.firstElementChild.innerHTML = figurSvg(p.aussehen, { getraenk: p.profil?.getraenk, denkt }); }
    if (R.ziehen && p.fid === ich.fid) continue; // eigene Figur hängt gerade am Finger
    const z = ziel(p, eingang);
    e.el.style.zIndex = z.z;
    setzeFigur(e, z, !neu);
  }
  for (const [fid, e] of R.fig) if (!da.has(fid)) { e.el.remove(); R.fig.delete(fid); }
  /* Stühle, Zähler, Auswahl */
  M.tische.forEach((T, i) => {
    const leute = sichtbar.filter((p) => p.tisch === i + 1);
    const belegt = new Set(leute.map((p) => p.platz));
    if (R.meinZiel?.tisch === i + 1) belegt.add(R.meinZiel.platz);
    T.plaetze.forEach((_, j) => R.raum.querySelector(`[data-stuhl="${i + 1}-${j}"]`)?.classList.toggle("besetzt", belegt.has(j)));
    const tz = R.raum.querySelector(`[data-zelle="${i + 1}"] .tz`);
    tz.textContent = `${leute.length}/${r.plaetze}`;
    tz.classList.toggle("voll", leute.length >= r.plaetze);
  });
  R.raum.querySelectorAll("[data-zelle]").forEach((z) => z.classList.toggle("gewaehlt", String(auswahl) === z.dataset.zelle));
  /* Kopf, Hinweis, Karte */
  const t = meinTisch();
  setHtml("#rKopf", ichLeiste(r.phase === "anmelden" ? "Das bist du" : t ? `Du sitzt an Tisch ${t}` : "Such dir einen Tisch aus"));
  setHtml("#rHinweis", r.phase === "anmelden"
    ? `<div class="hinweis"><b>⏳</b><span>Gleich öffnen die Tische. Dann ziehst du deine Figur an einen Tisch.</span></div>`
    : meldung ? `<p class="fehler">${esc(meldung)}</p>`
    : `<div class="hinweis"><b>👆</b><span>Zieh deine Figur an einen Tisch. Tipp auf einen Tisch, um die Profile zu sehen.</span></div>`);
  let karte = "";
  if (typeof auswahl === "number" && auswahl <= r.tische) karte = tischKarte(auswahl, r.phase === "wahl", false);
  else if (auswahl === "eingang") {
    const leute = sichtbar.filter((p) => !p.tisch && p.fid !== ich.fid);
    karte = `<section class="tisch"><div class="tkopf"><h2>Am Eingang</h2><span class="frei">${leute.length} ohne Tisch</span></div><div class="leute">${leute.map((p) => person(p, "#12324a")).join("") || `<span class="leer">Niemand mehr. Alle sitzen.</span>`}</div>${r.phase === "wahl" && t ? `<button class="knopf hell" data-tisch="0">Zurück zum Eingang</button>` : ""}</section>`;
  }
  setHtml("#karte", karte);
}
const htmlCache = {};
function setHtml(sel, html) { if (htmlCache[sel] !== html || !$(sel)?.innerHTML) { htmlCache[sel] = html; $(sel).innerHTML = html; } }

/* Ziehen mit dem Finger */
function trefferBei(x, y) {
  const M = R.M;
  for (let i = 0; i < M.tische.length; i++) {
    const T = M.tische[i];
    if (x >= T.x && x <= T.x + T.cw && y >= T.y && y <= T.y + T.ch) return i + 1;
  }
  if (y >= M.eingangOben && y <= M.eingangOben + M.eingangH) return 0;
  return null;
}
function raumPunkt(ev) { const b = R.raum.getBoundingClientRect(); return { x: ev.clientX - b.left, y: ev.clientY - b.top }; }
app.addEventListener("pointerdown", (ev) => {
  const f = ev.target.closest(".ich-fig");
  if (!f || !R || stand.raum.phase !== "wahl") return;
  ev.preventDefault();
  f.setPointerCapture(ev.pointerId);
  const p = raumPunkt(ev);
  R.ziehen = { start: p, zeit: Date.now(), bewegt: false, ueber: null };
});
app.addEventListener("pointermove", (ev) => {
  if (!R?.ziehen) return;
  const p = raumPunkt(ev), z = R.ziehen;
  if (!z.bewegt && Math.hypot(p.x - z.start.x, p.y - z.start.y) < 8) return;
  z.bewegt = true;
  const e = R.fig.get(ich.fid), g = 54;
  e.el.classList.add("zieht", "laeuft");
  e.el.classList.remove("gleitet");
  e.el.style.transform = `translate(${p.x - g / 2}px, ${p.y - 30 - g * H_FIG}px) scale(${g / 100})`; // über dem Finger, damit man sie sieht
  e.ziel = { x: p.x - g / 2, y: p.y - 30 - g * H_FIG, s: g / 100 };
  const t = trefferBei(p.x, p.y - 30);
  if (t !== z.ueber) {
    R.raum.querySelectorAll(".ziel, .ziel-voll").forEach((el) => el.classList.remove("ziel", "ziel-voll"));
    if (t !== null) {
      const voll = t > 0 && amTisch(t).filter((x) => x.fid !== ich.fid).length >= stand.raum.plaetze;
      R.raum.querySelector(`[data-zelle="${t === 0 ? "eingang" : t}"]`)?.classList.add(voll ? "ziel-voll" : "ziel");
    }
    z.ueber = t;
  }
});
function ziehenEnde(ev) {
  if (!R?.ziehen) return;
  const z = R.ziehen; R.ziehen = null;
  const e = R.fig.get(ich.fid);
  e.el.classList.remove("zieht", "laeuft");
  R.raum.querySelectorAll(".ziel, .ziel-voll").forEach((el) => el.classList.remove("ziel", "ziel-voll"));
  if (!z.bewegt) { e.el.classList.remove("wackelt"); void e.el.offsetWidth; e.el.classList.add("wackelt"); raumAktualisieren(); return; }
  if (z.ueber === null || ev.type === "pointercancel") return raumAktualisieren();
  gehZu(z.ueber);
}
app.addEventListener("pointerup", ziehenEnde);
app.addEventListener("pointercancel", ziehenEnde);

let meldungT;
function meldungZeigen(text) {
  meldung = text;
  clearTimeout(meldungT);
  meldungT = setTimeout(() => { meldung = ""; if (R) raumAktualisieren(); }, 3500);
}

/* Hinsetzen: Figur läuft sofort los, der Server bestätigt */
async function gehZu(tisch) {
  const vorher = meinTisch();
  if (tisch === vorher || (tisch === 0 && !vorher)) return raumAktualisieren();
  if (tisch > 0) {
    const andere = amTisch(tisch).filter((p) => p.fid !== ich.fid);
    if (andere.length >= stand.raum.plaetze) { meldungZeigen("Der Tisch ist schon voll."); return raumAktualisieren(); }
    const belegt = new Set(andere.map((p) => p.platz));
    let platz = 0; while (belegt.has(platz)) platz++;
    R.meinZiel = { tisch, platz };
    auswahl = tisch;
  } else {
    R.meinZiel = { tisch: null, platz: null };
    auswahl = null;
  }
  meldung = "";
  raumAktualisieren();
  try { await api("setzen", { pid, tisch }); }
  catch (err) { meldungZeigen(err.message); }
  sig = "";
  await holen();
  if (R) { R.meinZiel = null; raumAktualisieren(); }
}

/* ---------- Was wird gezeigt? ---------- */
function darstellen() {
  if (!ich || !stand) return;
  const r = stand.raum, ph = r.phase;
  const offen = ph === "anmelden" || ph === "wahl";
  if (!offen && (ansicht === "fragen" || ansicht === "ausweis")) ansicht = null;
  if (ansicht === "ausweis") return zeigeHtml(ausweisHtml());
  if (ansicht === "fragen") return zeigeHtml(frageHtml());
  if (!ich.profil && offen) { ansicht = "fragen"; return zeigeHtml(frageHtml()); }
  if (!ich.profil) return zeigeHtml(`${ichLeiste("Du bist")}<h1>Die Gruppenwahl ist schon vorbei.</h1><p class="leise">Sag deiner Lehrkraft Bescheid.</p>`);
  if (ph === "aufloesen") return zeigeHtml(aufgeloestHtml());
  /* anmelden (Profil fertig) oder wahl: der Raum */
  const breite = R?.raum?.clientWidth ?? 0;
  if (!R || R.key !== `${r.tische}.${r.plaetze}.${breite}` || !document.body.contains(R.raum)) raumAufbauen();
  if (auswahl === null) { const t = meinTisch(); if (t) auswahl = t; }
  raumAktualisieren();
}
let groesseT;
addEventListener("resize", () => { clearTimeout(groesseT); groesseT = setTimeout(() => { if (R && !R.ziehen) { R = null; darstellen(); } }, 200); });

/* ---------- Bedienung ---------- */
app.addEventListener("click", async (e) => {
  if (R && e.target.closest(".raum")) {
    if (e.target.closest(".ich-fig")) return;
    const andere = e.target.closest(".fig");
    if (andere) { const p = stand.leute.find((x) => x.fid === andere.dataset.fid); auswahl = p?.tisch ?? "eingang"; }
    else { const z = e.target.closest("[data-zelle]"); if (!z) return; auswahl = z.dataset.zelle === "eingang" ? "eingang" : Number(z.dataset.zelle); }
    raumAktualisieren();
    $("#karte").scrollIntoView({ behavior: "smooth", block: "nearest" });
    return;
  }
  const el = e.target.closest("button");
  if (!el || el.closest("form")) return;
  const a = el.dataset.a;
  if (a === "weiter") { speicher.set("gruppen-gesehen-" + code, pid); ansicht = "fragen"; frageNr = 0; darstellen(); scrollTo(0, 0); return; }
  if (a === "zurueck") { frageNr = Math.max(0, frageNr - 1); meldung = ""; darstellen(); return; }
  if (a === "aendern") { ansicht = "fragen"; frageNr = 0; entwurf = { ...(ich.profil ?? {}) }; darstellen(); scrollTo(0, 0); return; }
  if (el.dataset.antwort) {
    entwurf[FRAGEN[frageNr].id] = el.dataset.antwort;
    meldung = "";
    if (frageNr < FRAGEN.length - 1) { frageNr++; darstellen(); scrollTo(0, 0); return; }
    el.disabled = true;
    try {
      await api("profil", { pid, profil: entwurf });
      ich.profil = { ...entwurf };
      ansicht = null; sig = "";
      darstellen(); holen(); scrollTo(0, 0);
    } catch (err) { meldung = err.message; darstellen(); }
    return;
  }
  if (el.dataset.tisch !== undefined && R) {
    el.disabled = true;
    scrollTo({ top: 0, behavior: "smooth" });
    gehZu(Number(el.dataset.tisch));
  }
});

starten();
</script>
