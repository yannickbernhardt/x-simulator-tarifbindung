<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Herzblatt – Gruppenwahl</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root { --kreide: #edf2f5; --tafel: #12324a; --muted: #5c6f7e; --linie: #d3dde4; --blitz: #ffc531; --herz: #e5412d; --holz: #d9a066; --holz-dunkel: #a8743f; }
* { box-sizing: border-box; }
body { min-height: 100vh; }
html, body { margin: 0; background: var(--kreide); color: var(--tafel); font-family: "Bricolage Grotesque", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
main { max-width: 480px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); display: grid; gap: 14px; }
h1 { font-size: 30px; line-height: 1.08; margin: 0; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 22px; line-height: 1.15; margin: 0; font-weight: 800; }
p { margin: 0; font-size: 17px; line-height: 1.45; }
.leise { color: var(--muted); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blitz); outline-offset: 2px; }
.knopf { font-size: 19px; font-weight: 800; border: none; border-radius: 14px; padding: 15px 16px; background: var(--tafel); color: #fff; width: 100%; }
.knopf:disabled { opacity: .45; }
.knopf.hell { background: #fff; color: var(--tafel); border: 2px solid var(--linie); }
.link { background: none; border: none; color: var(--muted); font-size: 16px; font-weight: 600; text-decoration: underline; padding: 6px 0; justify-self: start; }
.kopfzeile { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--herz); }
.fehler { color: #8c2a1c; font-weight: 600; }
input.name { font: inherit; font-size: 24px; font-weight: 800; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; color: var(--tafel); width: 100%; }

/* Figur */
.figurbox { display: grid; place-items: center; }
.figurbox svg { width: 190px; height: 239px; }
.mini svg, svg.mini { width: 40px; height: 50px; display: block; flex-shrink: 0; }
.figur .propeller { animation: dreh 1.2s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }

/* Identität */
.ausweis { background: #fff; border: 2px solid var(--linie); border-radius: 22px; padding: 18px 16px 20px; text-align: center; display: grid; gap: 8px; box-shadow: 0 4px 0 rgba(18,50,74,.08); }
.ausweis .name { font-size: 30px; line-height: 1.1; font-weight: 800; overflow-wrap: break-word; }
.psst { background: var(--tafel); color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.35; }
.psst b { font-size: 26px; }

/* Fragen */
.fortschritt { display: flex; gap: 6px; }
.fortschritt i { flex: 1; height: 6px; border-radius: 3px; background: var(--linie); }
.fortschritt i.an { background: var(--tafel); }
.frage { font-size: 27px; line-height: 1.12; font-weight: 800; }
.spass { display: inline-block; justify-self: start; background: var(--blitz); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 800; }
.antworten { display: grid; gap: 10px; }
.antwort { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 2px solid var(--linie); border-radius: 16px; padding: 13px 14px; font-size: 18px; font-weight: 600; color: var(--tafel); line-height: 1.25; }
.antwort .e { font-size: 30px; width: 38px; text-align: center; flex-shrink: 0; }
.antwort.an { border-color: var(--tafel); background: var(--tafel); color: #fff; }

/* Profil-Chips */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; gap: 4px; align-items: center; background: var(--kreide); border-radius: 999px; padding: 2px 9px 2px 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.spass { background: #fff4d1; }

/* Ich-Leiste */
.ich { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--linie); border-radius: 16px; padding: 8px 12px; }
.ich .wer { min-width: 0; }
.ich .wer small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.ich .wer b { display: block; font-size: 18px; line-height: 1.15; overflow-wrap: break-word; }

/* ---------- Spiel: Fortnite-Steuerung ---------- */
body.im-spiel { overflow: hidden; overscroll-behavior: none; }
.spiel { position: fixed; inset: 0; overflow: hidden; background: #d6e0e7; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.welt { position: absolute; left: 0; top: 0; width: 1250px; height: 900px; transform-origin: 0 0; will-change: transform; }
.boden { position: absolute; left: 12px; top: 90px; width: 1226px; height: 808px; background: var(--kreide); border-radius: 28px; box-shadow: inset 0 0 0 4px #c9d6df; }
.zelle { --t: var(--tafel); position: absolute; background: rgba(255,255,255,.72); border: 2px solid var(--linie); border-radius: 18px; transition: border-color .2s, box-shadow .2s, background .2s; }
.zelle .zk { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 21px; font-weight: 800; }
.zelle .tnr { background: var(--t); color: #fff; border-radius: 9px; padding: 1px 10px; }
.zelle .tz { color: var(--muted); font-variant-numeric: tabular-nums; }
.zelle .tz.voll { color: var(--t); }
.zelle.nah { border-color: var(--t); background: color-mix(in srgb, var(--t) 9%, #fff); box-shadow: 0 0 0 5px color-mix(in srgb, var(--t) 40%, transparent); }
.eingang { position: absolute; left: 30px; top: 724px; width: 1190px; height: 164px; border: 3px dashed #c3d0d9; border-radius: 18px; }
.eingang .lab { position: absolute; left: 18px; top: 14px; font-size: 24px; font-weight: 800; color: var(--muted); }
.tischbild, .stuhl { position: absolute; pointer-events: none; }
.tischbild { z-index: 3; }
.stuhl { transition: opacity .3s; }
.stuhl.hinten { z-index: 2; } .stuhl.vorn { z-index: 4; }
.stuhl.besetzt { opacity: 0; }
.fig { position: absolute; left: 0; top: 0; width: 100px; height: 125.45px; transform-origin: 0 0; z-index: 4; }
.fig .innen { width: 100%; height: 100%; }
.fig svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fig.links svg { transform: scaleX(-1); }
.fig.gleitet { transition: transform var(--dauer, .5s) linear; }
.fig .glied { transform-box: view-box; }
.fig .a1 { transform-origin: 25px 74px; } .fig .a2 { transform-origin: 75px 74px; }
.fig .b1 { transform-origin: 40px 104px; } .fig .b2 { transform-origin: 60px 104px; }
.fig.laeuft .b1, .fig.laeuft .a2 { animation: schwing .26s ease-in-out infinite alternate; }
.fig.laeuft .b2, .fig.laeuft .a1 { animation: schwing .26s ease-in-out infinite alternate-reverse; }
.fig.laeuft .innen { animation: wipp .13s ease-in-out infinite alternate; }
@keyframes schwing { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
@keyframes wipp { to { transform: translateY(-5px); } }
.fig.ich-fig::before { content: ""; position: absolute; inset: -6% -16% -2%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,197,49,.9), rgba(255,197,49,0)); z-index: -1; }
.fig.ich-fig .du { position: absolute; left: 50%; top: -40px; transform: translateX(-50%); background: var(--tafel); color: #fff; font-weight: 800; font-size: 30px; border-radius: 12px; padding: 0 11px; white-space: nowrap; }
.fig.ich-fig .du::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: var(--tafel); }
@media (prefers-reduced-motion: reduce) { .fig.laeuft .glied, .fig.laeuft .innen, .figur .propeller { animation: none; } }

/* Anzeigen über dem Spiel */
.hud { position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); z-index: 20; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.95); border-radius: 16px; padding: 5px 8px 5px 10px; box-shadow: 0 2px 12px rgba(18,50,74,.18); }
.hud .mini svg { width: 34px; height: 43px; }
.hud .wer { flex: 1; min-width: 0; }
.hud .wer small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.hud .wer b { display: block; font-size: 16px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hudknopf { border: 2px solid var(--linie); background: #fff; border-radius: 10px; font-size: 14px; font-weight: 700; padding: 6px 9px; color: var(--tafel); white-space: nowrap; }
.info { --t: var(--tafel); position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 64px); max-height: 40vh; overflow: auto; z-index: 19; background: #fff; border-radius: 16px; border-left: 7px solid var(--t); box-shadow: 0 4px 16px rgba(18,50,74,.22); padding: 9px 12px; display: none; gap: 7px; touch-action: pan-y; }
.info.an { display: grid; }
.info h3 { margin: 0; font-size: 18px; color: var(--t); display: flex; gap: 8px; align-items: baseline; }
.info h3 span { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.info .spruch { font-size: 13px; padding: 2px 8px; }
.info .person { gap: 8px; }
.info .mini svg { width: 28px; height: 35px; }
.info .pname { font-size: 14px; }
.info .chip { font-size: 12px; padding: 1px 7px 1px 5px; }
.info .gesucht, .info .leer { font-size: 13px; }
@media (orientation: landscape) and (max-height: 560px) {
  .hud { right: auto; max-width: 48vw; }
  .info { left: auto; width: min(340px, 44vw); top: max(10px, env(safe-area-inset-top)); max-height: calc(100vh - 150px); }
}
.stick, .geist { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; background: rgba(18,50,74,.2); border: 3px solid rgba(255,255,255,.9); z-index: 21; pointer-events: none; }
.stick { display: none; }
.stick.an { display: block; }
.stick i, .geist i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.96); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.geist { left: calc(env(safe-area-inset-left) + 92px); top: calc(100% - 120px - env(safe-area-inset-bottom)); opacity: .6; }
.geist::after { content: "Daumen hier: laufen"; position: absolute; top: 128px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 800; color: var(--tafel); }
.spiel.lenkt .geist, .spiel.sitzt .geist { display: none; }
.aktion { --t: var(--tafel); position: absolute; right: calc(18px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 112px; height: 112px; border-radius: 50%; border: 4px solid #fff; background: var(--t); color: #fff; font-size: 16px; font-weight: 800; line-height: 1.1; box-shadow: 0 6px 18px rgba(18,50,74,.35); z-index: 21; padding: 8px; }
.aktion[hidden] { display: none; }
.aktion:disabled { opacity: .55; }
.aktion .e { display: block; font-size: 30px; margin-bottom: 2px; }
.aktion:active:not(:disabled) { transform: scale(.94); }
.toast { position: absolute; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--tafel); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; z-index: 22; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; width: max-content; max-width: 84vw; }
.toast.an { opacity: 1; }

/* 3D-Ansicht: die Welt als Leinwand hinter den Anzeigen (ohne WebGL bleibt die 2D-Ansicht oben) */
.spiel.drei { background: #dff0f2; }
.leinwand { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.wisch { position: absolute; right: calc(20px + env(safe-area-inset-right)); bottom: calc(154px + env(safe-area-inset-bottom)); z-index: 21; pointer-events: none; background: rgba(255,255,255,.9); color: var(--tafel); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 800; box-shadow: 0 2px 8px rgba(18,50,74,.18); transition: opacity .4s; }
.spiel.gedreht .wisch, .spiel.sitzt .wisch { opacity: 0; }
.pruef { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); z-index: 23; pointer-events: none; background: rgba(18,50,74,.82); color: #fff; border-radius: 8px; padding: 3px 8px; font: 600 12px/1.3 ui-monospace, monospace; }

/* Tischkarte */
.tisch { --t: var(--tafel); background: #fff; border: 2px solid var(--linie); border-left: 8px solid var(--t); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.tisch.meiner { border-color: var(--t); }
.tkopf { display: flex; align-items: baseline; gap: 10px; }
.tkopf h2 { color: var(--t); }
.tkopf .frei { margin-left: auto; font-size: 15px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.spruch { font-size: 15px; font-weight: 800; background: var(--kreide); border-radius: 10px; padding: 4px 10px; justify-self: start; }
.gesucht { font-size: 15px; color: var(--muted); }
.gesucht b { color: var(--tafel); }
.leute { display: grid; gap: 8px; }
.person { display: flex; gap: 10px; align-items: center; }
.person .text { min-width: 0; display: grid; gap: 3px; }
.person .pname { font-size: 16px; font-weight: 800; line-height: 1.2; }
.person .klar { font-size: 22px; line-height: 1.1; font-weight: 800; }
.person .klar + .pname { font-size: 14px; color: var(--muted); font-weight: 600; }
.person .du { background: var(--t); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; vertical-align: 2px; }
.leer { color: var(--muted); font-size: 15px; }
.tisch .knopf { padding: 12px; font-size: 17px; background: var(--t); }
.tisch .knopf.hell { background: #fff; color: var(--tafel); }
.gross { text-align: center; display: grid; gap: 6px; padding: 4px 0; }
.gross .zahl { font-size: 88px; line-height: 1; font-weight: 800; color: var(--t, var(--tafel)); }
#netz { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #8c2a1c; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 15px; display: none; text-align: center; z-index: 20; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="leise">Einen Moment …</p></main>
<div id="netz">Keine Verbindung. Es wird weiter versucht …</div>

<script type="module">
import { FRAGEN, ANTWORT, nochGesucht, tischSpruch, TISCHFARBEN } from "/gruppen/daten.js";
import { figurSvg } from "/gruppen/figur.js";
import { berechneLayout, eingangPlatz, schritt, tischInDerNaehe, hinterTisch, vorDemTisch, H_FIG, TEMPO } from "/gruppen/raum.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = location.pathname.split("/").filter(Boolean)[1];
const speicher = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, weg(k) { try { localStorage.removeItem(k); } catch {} } };
const app = $("#app");

let pid = speicher.get("gruppen-" + code);
let ich = null; // { fid, name, vorname, aussehen, profil }
let stand = null, sig = "";
let ansicht = null; // "name" | "ausweis" | "fragen" | null (dann entscheidet die Phase)
let frageNr = 0, entwurf = {};
let meldung = "", letztesHtml = "";

/* ---------- 3D-Welt (dieselbe wie in Zinssturm) ----------
   Die Bausteine werden erst nach dem Anmelden geladen. Ohne WebGL, wenn das Laden scheitert oder mit ?2d
   in der Adresse bleibt die 2D-Ansicht. Schalter zum Prüfen: ?stufe=0…3 (Bildqualität), ?fps=1 (Bildrate). */
const schalter = new URLSearchParams(location.search);
let DREI = null; // { erzeugePlatz, erzeugeSteuerung } · false = 2D · null = noch offen
let dreiLaedt = false, dreiFrist = 0, dreiVerluste = 0;
function kannDrei() {
  try {
    const gl = document.createElement("canvas").getContext("webgl2");
    if (!gl) return false;
    gl.getExtension("WEBGL_lose_context")?.loseContext();
    return true;
  } catch { return false; }
}
function ladeDrei() {
  if (DREI !== null || dreiLaedt) return;
  if (schalter.has("2d") || !kannDrei()) { DREI = false; return; }
  dreiLaedt = true;
  Promise.all([import("/gruppen/platz3d.js"), import("/welt3d/steuerung.js")])
    .then(([platz, steuerung]) => { if (DREI === null) DREI = { erzeugePlatz: platz.erzeugePlatz, erzeugeSteuerung: steuerung.erzeugeSteuerung }; })
    .catch(() => { if (DREI === null) DREI = false; })
    .finally(() => { dreiLaedt = false; clearTimeout(dreiFrist); dreiFrist = 0; if (ich && stand) darstellen(); });
}

async function api(aktion, body) {
  const r = await fetch(`/api/gruppen/${code}/${aktion}`, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Fehler " + r.status), { status: r.status, daten: j });
  return j;
}
function zeigeHtml(html) {
  spielWeg();
  if (html !== letztesHtml) { letztesHtml = html; app.innerHTML = html; }
}

/* ---------- Start: Raum prüfen, dann mit gespeicherter ID wieder rein oder Vornamen abfragen ---------- */
async function starten() {
  try {
    const j = await api("stand");
    stand = j; sig = j.sig;
  } catch (e) {
    if (e.status === 404) return zeigeHtml(`<h1>Diesen Raum gibt es nicht (mehr).</h1><p class="leise">Schau noch einmal auf den Code am Beamer.</p><a class="knopf" style="text-align:center;text-decoration:none" href="/gruppen">Code eingeben</a>`);
    return setTimeout(starten, 1500);
  }
  if (pid) {
    try { return angemeldet(await api("beitreten", { pid })); }
    catch (e) { if (!e.daten?.brauchtName) return setTimeout(starten, 1200); speicher.weg("gruppen-" + code); pid = null; }
  }
  if (stand.raum.phase === "aufloesen") return zeigeHtml(`<h1>Die Gruppenwahl ist schon vorbei.</h1><p class="leise">Sag deiner Lehrkraft Bescheid.</p>`);
  ansicht = "name";
  zeigeHtml(nameHtml());
  $("#vorname")?.focus();
}
function angemeldet(j) {
  pid = j.pid; speicher.set("gruppen-" + code, pid);
  ich = { fid: j.fid, name: j.name, vorname: j.vorname, aussehen: j.aussehen, profil: j.profil };
  entwurf = { ...(ich.profil ?? {}) };
  ansicht = ich.profil ? null : speicher.get("gruppen-gesehen-" + code) === pid ? "fragen" : "ausweis";
  letztesHtml = "";
  ladeDrei();
  darstellen();
  holen();
}
function nameHtml() {
  return `<div class="kopfzeile">Herzblatt · Gruppenwahl</div>
    <h1>Wie heißt du?</h1>
    <form id="nameForm" style="display:grid;gap:12px">
      <input class="name" id="vorname" name="vorname" maxlength="20" autocomplete="given-name" autocapitalize="words" placeholder="Vorname" required>
      <p class="leise">Nur dein Vorname. Er bleibt geheim und steht erst ganz am Ende am Beamer unter deiner Figur.</p>
      ${meldung ? `<p class="fehler">${esc(meldung)}</p>` : ""}
      <button class="knopf">Geheime Identität holen</button>
    </form>`;
}
app.addEventListener("submit", async (e) => {
  if (e.target.id !== "nameForm") return;
  e.preventDefault();
  const knopf = e.target.querySelector("button");
  knopf.disabled = true;
  try { angemeldet(await api("beitreten", { vorname: $("#vorname").value })); meldung = ""; }
  catch (err) { meldung = err.message; knopf.disabled = false; letztesHtml = ""; const v = $("#vorname").value; zeigeHtml(nameHtml()); $("#vorname").value = v; }
});

/* ---------- Stand holen ---------- */
let fehlZaehler = 0, holT;
async function holen() {
  clearTimeout(holT);
  if (!document.hidden) {
    try {
      const j = await api(`stand?sig=${encodeURIComponent(sig)}`);
      fehlZaehler = 0; $("#netz").style.display = "none";
      if (!j.gleich) {
        stand = j; sig = j.sig;
        const meinStand = stand.leute.find((p) => p.fid === ich.fid);
        if (meinStand) ich.profil = meinStand.profil ?? ich.profil;
        darstellen();
      }
    } catch (e) {
      if (++fehlZaehler > 3) $("#netz").style.display = "block";
    }
  }
  holT = setTimeout(holen, stand?.raum.phase === "wahl" ? 1200 : 2000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && ich) holen(); });

/* ---------- Bausteine ---------- */
function chips(p) {
  if (!p) return `<span class="leer">füllt noch das Profil aus …</span>`;
  return `<div class="chips">${FRAGEN.map((f) => {
    const a = ANTWORT[f.id][p[f.id]];
    return a ? `<span class="chip${f.art === "spass" ? " spass" : ""}">${a.e} ${esc(a.kurz)}</span>` : "";
  }).join("")}</div>`;
}
function person(p, farbe, mitKlarnamen) {
  const du = p.fid === ich.fid ? `<span class="du" style="background:${farbe}">du</span>` : "";
  const kopf = mitKlarnamen && p.vorname
    ? `<div class="klar">${esc(p.vorname)}${du}</div><div class="pname">${esc(p.name)}</div>`
    : `<div class="pname">${esc(p.name)}${du}</div>`;

    <div class="text">${kopf}${chips(p.profil)}</div></div>`;
}
const amTisch = (t) => stand.leute.filter((p) => p.tisch === t).sort((a, b) => a.platz - b.platz);
const meinTisch = () => stand.leute.find((p) => p.fid === ich.fid)?.tisch ?? null;
function ichLeiste(text) {
  return `<div class="ich"><span class="mini">${figurSvg(ich.aussehen, { getraenk: ich.profil?.getraenk })}</span>
    <div class="wer"><small>${esc(text)}</small><b>${esc(ich.name)}</b></div></div>`;
}
function tischKarte(t, knoepfe, mitKlarnamen) {
  const r = stand.raum, leute = amTisch(t), farbe = TISCHFARBEN[t - 1];
  const meiner = meinTisch() === t, voll = leute.length >= r.plaetze;
  const profile = leute.map((p) => p.profil);
  const spruch = tischSpruch(profile), gesucht = leute.length ? nochGesucht(profile) : [];
  let knopf = "";
  if (knoepfe) knopf = meiner ? `<button class="knopf hell" data-tisch="0">Hier sitzt du ✓ · aufstehen</button>` : voll ? "" : `<button class="knopf" data-tisch="${t}">Hierhin laufen</button>`;
  return `<section class="tisch${meiner ? " meiner" : ""}" style="--t:${farbe}">
    <div class="tkopf"><h2>Tisch ${t}</h2><span class="frei">${voll ? "voll" : `${r.plaetze - leute.length} ${r.plaetze - leute.length === 1 ? "Platz" : "Plätze"} frei`}</span></div>
    ${spruch ? `<div class="spruch">${esc(spruch)}</div>` : ""}

    ${gesucht.length && !voll ? `<div class="gesucht">Noch gesucht: <b>${gesucht.map((g) => ANTWORT.rolle[g].e + " " + ANTWORT.rolle[g].kurz).join(" · ")}</b></div>` : ""}
    ${knopf}</section>`;
}

/* ---------- Ansichten ohne Raum ---------- */

/* ---------- Spiel: Figur mit dem Joystick durch den Raum steuern (wie Fortnite auf dem Handy) ----------
   Links erscheint der Joystick dort, wo der Daumen aufsetzt. Rechts unten der Knopf zum Hinsetzen bzw. Aufstehen.
   Die Kamera folgt der eigenen Figur. Die anderen Figuren laufen live mit (Positionen ca. zweimal pro Sekunde). */
let G = null;
function spielWeg() {
  if (!G) return;
  cancelAnimationFrame(G.raf);
  clearTimeout(G.posT);
  G.steuer?.zerlegen();
  G.drei?.zerlegen();
  G = null;
  document.body.classList.remove("im-spiel");
}

function spielAufbauen() {
  spielWeg();
  const r = stand.raum;
  const L = berechneLayout(r.tische, r.plaetze);
  const mitDrei = !!DREI;
  document.body.classList.add("im-spiel");
  app.innerHTML = `<div class="spiel${mitDrei ? " drei" : ""}" id="spiel">
    ${mitDrei ? `<canvas class="leinwand" id="leinwand"></canvas>` : `<div class="welt" id="welt"></div>`}
    <div class="hud"><span class="mini" id="hudFig"></span><div class="wer"><small id="hudStatus"></small><b>${esc(ich.name)}</b></div><button class="hudknopf" data-a="aendern">✏️ Profil</button></div>
    <div class="info" id="info"></div>
    <div class="geist"><i></i></div>
    <div class="stick" id="stick"><i></i></div>
    <button class="aktion" id="aktion" hidden></button>
    <div class="toast" id="toast" role="status"></div>
    ${mitDrei ? `<div class="wisch">Hier wischen: umsehen</div>${schalter.has("fps") ? `<div class="pruef" id="pruef"></div>` : ""}` : ""}
  </div>`;
  letztesHtml = "";
  let h = `<div class="boden"></div>`;
  if (!mitDrei) L.tische.forEach((T, i) => {
    const farbe = TISCHFARBEN[i], kante = T.th * 0.2;
    h += `<div class="zelle" data-zelle="${i + 1}" style="left:${T.x}px;top:${T.y}px;width:${T.cw}px;height:${T.ch}px;--t:${farbe}"><div class="zk"><span class="tnr">Tisch ${i + 1}</span><span class="tz"></span></div></div>`;
    h += `<div class="tischbild" style="left:${T.cx - T.tw / 2}px;top:${T.tischOben}px"><svg width="${T.tw}" height="${T.th + kante}" viewBox="0 0 ${T.tw} ${T.th + kante}"><ellipse cx="${T.tw / 2}" cy="${T.th / 2 + kante}" rx="${T.tw / 2 - 1}" ry="${T.th / 2}" fill="var(--holz-dunkel)"/><ellipse cx="${T.tw / 2}" cy="${T.th / 2}" rx="${T.tw / 2 - 1}" ry="${T.th / 2}" fill="var(--holz)"/><ellipse cx="${T.tw / 2}" cy="${T.th / 2}" rx="${T.tw / 2 - 12}" ry="${T.th / 2 - 6}" fill="none" stroke="${farbe}" stroke-opacity=".35" stroke-width="3"/></svg></div>`;
    T.plaetze.forEach((p, j) => {
      const w = L.f * 0.62, hh = p.hinten ? L.f * 0.9 : L.f * 0.55;
      h += `<div class="stuhl ${p.hinten ? "hinten" : "vorn"}" data-stuhl="${i + 1}-${j}" style="left:${p.x - w / 2}px;top:${p.fuss - hh}px">${p.hinten
        ? `<svg width="${w}" height="${hh}" viewBox="0 0 62 90"><rect x="6" y="2" width="50" height="70" rx="12" fill="#c7d3dc"/><rect x="14" y="10" width="34" height="40" rx="8" fill="#dbe4ea"/></svg>`
        : `<svg width="${w}" height="${hh}" viewBox="0 0 62 55"><rect x="2" y="4" width="58" height="14" rx="7" fill="#c7d3dc"/><path d="M12 18 L8 53 M50 18 L54 53" stroke="#c7d3dc" stroke-width="6" stroke-linecap="round"/></svg>`}</div>`;
    });
  });
  h += `<div class="eingang"><span class="lab">Eingang</span></div>`;
  if (!mitDrei) $("#welt").innerHTML = h;
  G = {
    L, key: `${r.tische}.${r.plaetze}`, spiel: $("#spiel"), welt: $("#welt"), fig: new Map(),
    drei: null, steuer: null, erstesBild: true, pruefZeit: 0,
    ich: null, bewegt: false, richtung: 1, v: { x: 0, y: 0 }, tasten: new Set(), stick: null, cam: null,
    zuletzt: performance.now(), gesendet: 0, sendet: false, nochmal: false, laeuftZuletzt: false,
    meinZiel: undefined, posMap: {}, nah: null, html: {}, toastT: 0, beschaeftigt: false,
  };
  if (mitDrei) {
    try { dreiAufbauen(); }
    catch (fehler) {
      /* Die 3D-Welt lässt sich auf diesem Gerät nicht aufbauen: weiter mit der 2D-Ansicht */
      console.warn("Herzblatt: 3D-Ansicht nicht möglich, weiter in 2D.", fehler);
      DREI = false;
      return spielAufbauen();
    }
  } else spielEingaben();
  G.raf = requestAnimationFrame(schleife);
  posHolen();
}

/* 3D: Platz und Eingaben aus dem gemeinsamen Bausatz. Der Joystick bleibt das Element dieser Seite. */
function dreiAufbauen() {
  const spiel = G.spiel, leinwand = $("#leinwand"), stick = $("#stick"), knauf = stick.firstElementChild;
  const stufe = Number(schalter.get("stufe"));
  G.drei = DREI.erzeugePlatz(leinwand, { layout: G.L, festeStufe: schalter.has("stufe") && stufe >= 0 && stufe <= 3 ? Math.round(stufe) : undefined });
  G.steuer = DREI.erzeugeSteuerung({
    flaeche: spiel,
    ausnahme: (ziel) => !!ziel.closest("button, .info, .hud"),
    zeigeStick(bx, by, dx, dy, radius) {
      stick.style.left = bx + "px"; stick.style.top = by + "px";
      stick.style.width = stick.style.height = 2 * radius + "px";
      stick.style.margin = `${-radius}px 0 0 ${-radius}px`;
      knauf.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
      if (stick.classList.contains("an")) return;
      stick.classList.add("an"); spiel.classList.add("lenkt");
      if (meinSitz() && stand.raum.phase === "wahl") toast("Du sitzt. Erst aufstehen – Knopf rechts unten.");
    },
    versteckeStick() { stick.classList.remove("an"); spiel.classList.remove("lenkt"); },
  });
  if (schalter.has("fps")) window.herzblattPruef = G.drei; // nur zum Prüfen: Bildrate und Orte der Figuren
  /* Geht der Grafikspeicher verloren (zum Beispiel nach langer Pause), einmal neu aufbauen, beim zweiten Mal in 2D weiter */
  leinwand.addEventListener("webglcontextlost", (ev) => {
    ev.preventDefault();
    if (!G || G.spiel !== spiel) return;
    if (++dreiVerluste > 1) DREI = false;
    setTimeout(() => { if (G && G.spiel === spiel) { spielAufbauen(); darstellen(); } }, 300);
  });
}

/* Sitzt jemand? Für mich zählt ein gerade abgeschickter Wunsch, bis der Server ihn bestätigt. */
function sitzVon(p) {
  if (p.fid === ich.fid && G?.meinZiel !== undefined) return G.meinZiel.tisch ? G.meinZiel : null;
  return p.tisch && G.L.tische[p.tisch - 1]?.plaetze[p.platz] ? { tisch: p.tisch, platz: p.platz } : null;
}
const meinSitz = () => { const me = stand.leute.find((p) => p.fid === ich.fid); return me ? sitzVon(me) : null; };

function ortVon(p, eingang) {
  const L = G.L, sitz = sitzVon(p);
  if (sitz) { const pl = L.tische[sitz.tisch - 1].plaetze[sitz.platz]; return { x: pl.x, fuss: pl.fuss, g: L.f, z: pl.hinten ? 2 : 4 }; }
  const pos = G.posMap[p.fid];
  if (pos) return { x: pos[0], fuss: pos[1], g: L.lauf, z: hinterTisch(L, pos[0], pos[1]) ? 2 : 5, live: true };
  const e = eingangPlatz(Math.max(0, eingang.indexOf(p.fid)), eingang.length);
  return { x: e.x, fuss: e.fuss, g: e.g, z: 4 };
}
function setzeFig(e, o, gleiten) {
  const x = o.x - o.g / 2, y = o.fuss - o.g * H_FIG;
  const t = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(o.g / 100).toFixed(4)})`;
  const alt = e.o;
  e.o = o;
  e.el.style.zIndex = o.z;
  if (alt && Math.abs(alt.x - o.x) > 0.5) e.el.classList.toggle("links", o.x < alt.x);
  if (!gleiten || !alt) { e.el.classList.remove("gleitet"); e.el.style.transform = t; return; }
  const weg = Math.hypot(alt.x - o.x, alt.fuss - o.fuss);
  if (weg < 0.5 && Math.abs(alt.g - o.g) < 0.5) return;
  const dauer = Math.min(1.6, Math.max(0.25, weg / TEMPO));
  e.el.style.setProperty("--dauer", dauer + "s");
  e.el.classList.add("gleitet", "laeuft");
  e.el.style.transform = t;
  clearTimeout(e.t);
  e.t = setTimeout(() => e.el.classList.remove("gleitet", "laeuft"), dauer * 1000 + 40);
}
function eigeneFigur(laeuft) {
  const e = G?.fig.get(ich.fid);
  if (!e || !G.ich || meinSitz()) return;
  const L = G.L;
  const o = { x: G.ich.x, fuss: G.ich.y, g: L.lauf, z: hinterTisch(L, G.ich.x, G.ich.y) ? 2 : 6 };
  const x = o.x - o.g / 2, y = o.fuss - o.g * H_FIG;
  e.el.classList.remove("gleitet");
  e.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(o.g / 100).toFixed(4)})`;
  e.el.style.zIndex = o.z;
  e.el.classList.toggle("laeuft", laeuft);
  e.el.classList.toggle("links", G.richtung < 0);
  e.o = o;
}

function figurenAktualisieren() {
  if (!G) return;
  const L = G.L, leute = stand.leute, sitzeIch = meinSitz();
  const eingang = leute.filter((p) => !sitzVon(p) && !G.posMap[p.fid] && !(p.fid === ich.fid && G.bewegt)).map((p) => p.fid);
  /* Startpunkt der eigenen Figur: gespeicherte Position (nach Neuladen) oder ihr Platz am Eingang */
  if (!sitzeIch && !G.bewegt) {
    const pos = G.posMap[ich.fid];
    if (pos) G.ich = { x: pos[0], y: pos[1] };
    else if (!G.ich) { const e = eingangPlatz(Math.max(0, eingang.indexOf(ich.fid)), eingang.length); G.ich = { x: e.x, y: e.fuss }; }
  }
  if (G.drei) return figurenDrei(eingang);
  const da = new Set();
  for (const p of leute) {
    da.add(p.fid);
    let e = G.fig.get(p.fid), neu = false;
    if (!e) {
      const el = document.createElement("div");
      el.className = "fig" + (p.fid === ich.fid ? " ich-fig" : "");
      el.innerHTML = `<div class="innen"></div>${p.fid === ich.fid ? `<span class="du">du</span>` : ""}`;
      G.welt.appendChild(el);
      e = { el }; G.fig.set(p.fid, e); neu = true;
    }
    const denkt = !p.profil;
    const k = JSON.stringify([p.aussehen, p.profil?.getraenk, denkt]);
    if (e.k !== k) { e.k = k; e.el.firstElementChild.innerHTML = figurSvg(p.aussehen, { getraenk: p.profil?.getraenk, denkt }); }
    if (p.fid === ich.fid) {
      if (sitzeIch) setzeFig(e, ortVon(p, eingang), !neu);
      else if (!e.o || e.o.g !== L.lauf || neu) eigeneFigur(false);
      continue;
    }
    setzeFig(e, ortVon(p, eingang), !neu);
  }
  for (const [fid, e] of G.fig) if (!da.has(fid)) { e.el.remove(); G.fig.delete(fid); }
  /* Stühle und Zähler */
  L.tische.forEach((T, i) => {
    const am = leute.map(sitzVon).filter((s) => s?.tisch === i + 1);
    const belegt = new Set(am.map((s) => s.platz));
    T.plaetze.forEach((_, j) => G.welt.querySelector(`[data-stuhl="${i + 1}-${j}"]`)?.classList.toggle("besetzt", belegt.has(j)));
    const tz = G.welt.querySelector(`[data-zelle="${i + 1}"] .tz`);
    tz.textContent = `${am.length}/${stand.raum.plaetze}`;
    tz.classList.toggle("voll", am.length >= stand.raum.plaetze);
  });
}

/* 3D: dieselben Angaben an den Platz geben. Orte bleiben Bühnen-Pixel, Vornamen gibt es hier nicht. */
function figurenDrei(eingang) {
  const leute = stand.leute;
  G.drei.setzeFiguren(leute.map((p) => {
    const selbst = p.fid === ich.fid;
    const o = selbst && G.ich ? { x: G.ich.x, fuss: G.ich.y } : ortVon(p, eingang);
    const amEingang = eingang.indexOf(p.fid); // wer dicht nebeneinander am Eingang steht, trägt sein Schild auf wechselnder Höhe
    return { fid: p.fid, name: p.name, aussehen: p.aussehen, getraenk: p.profil?.getraenk, denkt: !p.profil, ich: selbst, sitz: sitzVon(p), x: o.x, y: o.fuss, stufe: amEingang >= 0 ? amEingang % 3 : 0 };
  }), G.erstesBild);
  G.erstesBild = false;
  const sitze = leute.map(sitzVon);
  G.L.tische.forEach((_, i) => G.drei.zaehler(i + 1, sitze.filter((s) => s?.tisch === i + 1).length, stand.raum.plaetze));
}

/* Anzeigen: Kopfzeile, Tischinfo, Aktionsknopf */
function setzeHtml(id, html) {
  if (G.html[id] === html) return;
  G.html[id] = html;
  $("#" + id).innerHTML = html;
}
function infoHtml(t) {
  const r = stand.raum, leute = amTisch(t);
  const voll = leute.length >= r.plaetze, profile = leute.map((p) => p.profil);
  const spruch = tischSpruch(profile), gesucht = leute.length && !voll ? nochGesucht(profile) : [];
  return `<h3>Tisch ${t}<span>${voll ? "voll" : `${r.plaetze - leute.length} ${r.plaetze - leute.length === 1 ? "Platz" : "Plätze"} frei`}</span></h3>
    ${spruch ? `<div class="spruch">${esc(spruch)}</div>` : ""}
    <div class="leute">${leute.map((p) => person(p, TISCHFARBEN[t - 1])).join("") || `<span class="leer">Noch niemand hier. Setz dich als Erste*r!</span>`}</div>
    ${gesucht.length ? `<div class="gesucht">Noch gesucht: <b>${gesucht.map((g) => ANTWORT.rolle[g].e + " " + ANTWORT.rolle[g].kurz).join(" · ")}</b></div>` : ""}`;
}
function anzeigenAktualisieren() {
  if (!G) return;
  const r = stand.raum, sitz = meinSitz();
  const t = sitz ? sitz.tisch : G.nah?.nr ?? null;
  setzeHtml("hudFig", figurSvg(ich.aussehen, { getraenk: ich.profil?.getraenk }));
  $("#hudStatus").textContent = r.phase === "anmelden" ? "Gleich öffnen die Tische" : sitz ? `Du sitzt an Tisch ${sitz.tisch}` : G.nah ? `Am Tisch ${G.nah.nr}` : "Lauf zu einem Tisch";
  G.spiel.classList.toggle("sitzt", !!sitz);
  if (G.drei) G.drei.nah(r.phase === "wahl" ? t : null);
  else G.welt.querySelectorAll(".zelle").forEach((z) => z.classList.toggle("nah", r.phase === "wahl" && Number(z.dataset.zelle) === t));
  const info = $("#info");
  if (r.phase === "wahl" && t) {
    info.style.setProperty("--t", TISCHFARBEN[t - 1]);

    info.classList.add("an");
  } else info.classList.remove("an");

  if (r.phase === "wahl" && sitz) { an = true; art = "aufstehen"; html = `<span class="e">🚶</span>Aufstehen`; farbe = TISCHFARBEN[sitz.tisch - 1]; }
  else if (r.phase === "wahl" && G.nah) {
    an = true; farbe = TISCHFARBEN[G.nah.nr - 1];
    const andere = amTisch(G.nah.nr).filter((p) => p.fid !== ich.fid).length;
    if (andere >= r.plaetze) { aus = true; html = `<span class="e">🚫</span>Tisch voll`; }
    else { art = "sitzen"; html = `<span class="e">🪑</span>Hinsetzen`; }
  }
  k.hidden = !an;
  k.disabled = aus || G.beschaeftigt;
  k.dataset.art = art;
  k.style.setProperty("--t", farbe);
  if (k.innerHTML !== html) k.innerHTML = html;
}
function toast(text) {
  if (!G) return;
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("an");
  clearTimeout(G.toastT);
  G.toastT = setTimeout(() => t.classList.remove("an"), 2600);
}

/* Spielschleife: eigene Figur bewegen, Kamera nachführen */
function schleife(jetzt) {
  if (!G) return;
  const vergangen = (jetzt - G.zuletzt) / 1000;
  const dt = Math.min(0.05, vergangen);
  G.zuletzt = jetzt;
  if (G.drei) return schleifeDrei(jetzt, dt, Math.min(0.25, vergangen));
  const r = stand.raum;
  let vx = G.v.x, vy = G.v.y;
  if (G.tasten.size) {
    vx = (G.tasten.has("r") ? 1 : 0) - (G.tasten.has("l") ? 1 : 0);
    vy = (G.tasten.has("u") ? 1 : 0) - (G.tasten.has("o") ? 1 : 0);
    const n = Math.hypot(vx, vy) || 1; vx /= n; vy /= n;
  }
  const darf = (r.phase === "anmelden" || r.phase === "wahl") && G.ich && !meinSitz() && !G.beschaeftigt;
  const laeuft = darf && (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01);
  if (laeuft) {
    [G.ich.x, G.ich.y] = schritt(G.L, G.ich.x, G.ich.y, vx * TEMPO * dt, vy * TEMPO * dt);
    if (Math.abs(vx) > 0.15) G.richtung = vx < 0 ? -1 : 1;
    G.bewegt = true;
    eigeneFigur(true);
    if (jetzt - G.gesendet > 300) posSenden(jetzt);
    const nah = r.phase === "wahl" ? tischInDerNaehe(G.L, G.ich.x, G.ich.y) : null;
    if (nah !== G.nah) { G.nah = nah; anzeigenAktualisieren(); }
  } else if (G.laeuftZuletzt) { eigeneFigur(false); posSenden(jetzt); }
  G.laeuftZuletzt = laeuft;
  kamera(dt);
  G.raf = requestAnimationFrame(schleife);
}
/* 3D: Der Joystick zählt aus Sicht der Kamera. Gelaufen wird weiter in Bühnen-Pixeln mit den Regeln aus raum.js.
   dt begrenzt den eigenen Schritt (wie in 2D); die Welt bekommt die echte Zeit seit dem letzten Bild, damit die
   anderen Figuren auch bei schwacher Bildrate nicht hinterherhinken. */
function schleifeDrei(jetzt, dt, dtBild) {
  const r = stand.raum;
  const dreh = G.steuer.holeDrehung();
  if (dreh.x || dreh.y) {
    const k = dreh.maus ? 0.0046 : 0.0062;
    G.drei.dreheKamera(dreh.x * k, dreh.y * k * 0.62);
    G.spiel.classList.add("gedreht");
  }
  const e = G.steuer.richtung();
  const darf = (r.phase === "anmelden" || r.phase === "wahl") && G.ich && !meinSitz() && !G.beschaeftigt;
  const laeuft = darf && (Math.abs(e.x) > 0.01 || Math.abs(e.y) > 0.01);
  if (laeuft) {
    const [vx, vy] = G.drei.eingabeZuBuehne(e.x, e.y);
    [G.ich.x, G.ich.y] = schritt(G.L, G.ich.x, G.ich.y, vx * dt, vy * dt);
    G.bewegt = true;
    if (jetzt - G.gesendet > 300) posSenden(jetzt);
    const nah = r.phase === "wahl" ? tischInDerNaehe(G.L, G.ich.x, G.ich.y) : null;
    if (nah !== G.nah) { G.nah = nah; anzeigenAktualisieren(); }
  } else if (G.laeuftZuletzt) posSenden(jetzt);
  G.laeuftZuletzt = laeuft;
  if (G.ich && !meinSitz()) G.drei.setzeIch(G.ich.x, G.ich.y);
  G.drei.bild(dtBild);
  if (schalter.has("fps") && jetzt - G.pruefZeit > 500) {
    G.pruefZeit = jetzt;
    const b = G.drei.buehne;
    $("#pruef").textContent = `${Math.round(b.fps())} B/s · Stufe ${b.stufe()} · ${b.zeichenaufrufe()} Aufrufe · ${Math.round(b.dreiecke() / 1000)}k Dreiecke`;
  }
  G.raf = requestAnimationFrame(schleife);
}
function kamera(dt) {
  const vw = innerWidth, vh = innerHeight;
  const s = Math.max(0.55, Math.min(0.95, Math.min(vw, vh) / 520));
  const sitz = meinSitz();
  let tx, ty;
  if (sitz) { const pl = G.L.tische[sitz.tisch - 1].plaetze[sitz.platz]; tx = pl.x; ty = pl.fuss - 40; }
  else if (G.ich) { tx = G.ich.x; ty = G.ich.y - 40; }
  else { tx = 625; ty = 495; }
  const hw = vw / (2 * s), hh = vh / (2 * s);
  tx = 1250 < 2 * hw ? 625 : Math.min(1250 - hw, Math.max(hw, tx));
  ty = 810 < 2 * hh ? 495 : Math.min(900 - hh + 30, Math.max(90 + hh - 70, ty));
  if (!G.cam) G.cam = { x: tx, y: ty };
  const k = 1 - Math.pow(0.0008, dt);
  G.cam.x += (tx - G.cam.x) * k;
  G.cam.y += (ty - G.cam.y) * k;
  G.welt.style.transform = `translate(${(vw / 2 - G.cam.x * s).toFixed(1)}px, ${(vh / 2 - G.cam.y * s).toFixed(1)}px) scale(${s.toFixed(4)})`;
}

/* Positionen senden und holen */
function posSenden(jetzt) {
  if (!G?.ich) return;
  if (G.sendet) { G.nochmal = true; return; }
  G.gesendet = jetzt; G.sendet = true;
  api("pos", { pid, x: Math.round(G.ich.x), y: Math.round(G.ich.y) }).catch(() => {}).finally(() => {
    if (!G) return;
    G.sendet = false;
    if (G.nochmal) { G.nochmal = false; posSenden(performance.now()); }
  });
}
async function posHolen() {
  if (!G) return;
  clearTimeout(G.posT);
  try {
    const j = await api("pos");
    if (G && JSON.stringify(j.pos) !== JSON.stringify(G.posMap)) { G.posMap = j.pos; figurenAktualisieren(); }
  } catch {}
  if (G) G.posT = setTimeout(posHolen, document.hidden ? 2000 : 450);
}

/* Eingaben: schwebender Joystick (linke Bildschirmseite), Tastatur am Rechner */
function spielEingaben() {
  const sp = G.spiel, stick = $("#stick"), knauf = stick.firstElementChild, R = 52;
  sp.addEventListener("pointerdown", (ev) => {
    if (!G || G.stick || ev.target.closest("button, .info, .hud")) return;
    if (ev.clientX > innerWidth * 0.62) return;
    ev.preventDefault();
    try { sp.setPointerCapture(ev.pointerId); } catch {}
    G.stick = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
    stick.style.left = ev.clientX + "px"; stick.style.top = ev.clientY + "px";
    knauf.style.transform = "";
    stick.classList.add("an"); sp.classList.add("lenkt");
    if (meinSitz() && stand.raum.phase === "wahl") toast("Du sitzt. Erst aufstehen – Knopf rechts unten.");
  });
  sp.addEventListener("pointermove", (ev) => {
    if (!G?.stick || ev.pointerId !== G.stick.id) return;
    let dx = ev.clientX - G.stick.x, dy = ev.clientY - G.stick.y;
    const n = Math.hypot(dx, dy);
    if (n > R) { dx = (dx / n) * R; dy = (dy / n) * R; }
    knauf.style.transform = `translate(${dx}px, ${dy}px)`;
    const staerke = n < 8 ? 0 : Math.min(1, n / R);
    G.v = n ? { x: (dx / Math.min(n, R)) * staerke, y: (dy / Math.min(n, R)) * staerke } : { x: 0, y: 0 };
  });
  const los = (ev) => {
    if (!G?.stick || ev.pointerId !== G.stick.id) return;
    G.stick = null; G.v = { x: 0, y: 0 };
    stick.classList.remove("an"); sp.classList.remove("lenkt");
  };
  sp.addEventListener("pointerup", los);
  sp.addEventListener("pointercancel", los);
}
const TASTEN = { arrowleft: "l", a: "l", arrowright: "r", d: "r", arrowup: "o", w: "o", arrowdown: "u", s: "u" };
addEventListener("keydown", (e) => { const t = TASTEN[e.key.toLowerCase()]; if (G && t) { G.tasten.add(t); e.preventDefault(); } });
addEventListener("keyup", (e) => { const t = TASTEN[e.key.toLowerCase()]; if (G && t) G.tasten.delete(t); });
addEventListener("blur", () => { if (G) { G.tasten.clear(); G.v = { x: 0, y: 0 }; } });

/* Hinsetzen und Aufstehen: sofort zeigen, der Server bestätigt */
async function gehZu(tisch) {
  if (!G || G.beschaeftigt) return;
  const L = G.L, vorher = meinSitz();
  if (tisch > 0) {
    const andere = amTisch(tisch).filter((p) => p.fid !== ich.fid);
    if (andere.length >= stand.raum.plaetze) return toast("Der Tisch ist schon voll.");
    const belegt = new Set(andere.map((p) => p.platz));
    let platz = 0; while (belegt.has(platz)) platz++;
    G.meinZiel = { tisch, platz };
  } else {
    if (!vorher) return;
    const [x, y] = vorDemTisch(L, L.tische[vorher.tisch - 1]);
    G.ich = { x, y }; G.bewegt = true;
    G.meinZiel = { tisch: null };
    posSenden(performance.now());
  }
  G.beschaeftigt = true;
  if (tisch === 0) { const e = G.fig.get(ich.fid); if (e) setzeFig(e, { x: G.ich.x, fuss: G.ich.y, g: L.lauf, z: 6 }, true); } // vom Stuhl aufstehen
  figurenAktualisieren();
  anzeigenAktualisieren();
  try { await api("setzen", { pid, tisch }); }
  catch (err) {
    toast(err.message);
    if (tisch > 0 && G) G.meinZiel = undefined;
  }
  sig = "";
  await holen();
  if (G) { G.meinZiel = undefined; G.beschaeftigt = false; G.nah = meinSitz() ? null : tischInDerNaehe(L, G.ich?.x ?? 0, G.ich?.y ?? 0); figurenAktualisieren(); anzeigenAktualisieren(); }
}

/* ---------- Was wird gezeigt? ---------- */
function darstellen() {
  if (!ich || !stand) return;
  const r = stand.raum, ph = r.phase;
  const offen = ph === "anmelden" || ph === "wahl";
  if (!offen && (ansicht === "fragen" || ansicht === "ausweis")) ansicht = null;
  if (ansicht === "ausweis") return zeigeHtml(ausweisHtml());
  if (ansicht === "fragen") return zeigeHtml(frageHtml());
  if (!ich.profil && offen) { ansicht = "fragen"; return zeigeHtml(frageHtml()); }
  if (!ich.profil) return zeigeHtml(`${ichLeiste("Du bist")}<h1>Die Gruppenwahl ist schon vorbei.</h1><p class="leise">Sag deiner Lehrkraft Bescheid.</p>`);
  if (ph === "aufloesen") return zeigeHtml(aufgeloestHtml());
  /* anmelden (Profil fertig) oder wahl: das Spiel */
  if (DREI === null) {
    /* Die 3D-Welt lädt noch: kurz warten, nach zehn Sekunden geht es in 2D weiter */
    ladeDrei();
    if (DREI === null) {
      dreiFrist ||= setTimeout(() => { if (DREI === null) { DREI = false; darstellen(); } }, 10000);
      return zeigeHtml(`${ichLeiste("Du bist")}<p class="leise">Die Welt wird aufgebaut …</p>`);
    }
  }
  if (!G || G.key !== `${r.tische}.${r.plaetze}` || !document.body.contains(G.spiel)) spielAufbauen();
  if (ph !== "wahl") G.nah = null;
  else if (!meinSitz() && G.ich) G.nah = tischInDerNaehe(G.L, G.ich.x, G.ich.y);
  figurenAktualisieren();
  anzeigenAktualisieren();
}

/* ---------- Bedienung ---------- */
app.addEventListener("click", async (e) => {
  const el = e.target.closest("button");
  if (!el || el.closest("form")) return;
  if (el.id === "aktion") {
    if (el.dataset.art === "sitzen" && G?.nah) gehZu(G.nah.nr);
    else if (el.dataset.art === "aufstehen") gehZu(0);
    return;
  }
  const a = el.dataset.a;
  if (a === "weiter") { speicher.set("gruppen-gesehen-" + code, pid); ansicht = "fragen"; frageNr = 0; darstellen(); scrollTo(0, 0); return; }
  if (a === "zurueck") { frageNr = Math.max(0, frageNr - 1); meldung = ""; darstellen(); return; }
  if (a === "aendern") { ansicht = "fragen"; frageNr = 0; entwurf = { ...(ich.profil ?? {}) }; darstellen(); scrollTo(0, 0); return; }
  if (el.dataset.antwort) {
    entwurf[FRAGEN[frageNr].id] = el.dataset.antwort;
    meldung = "";
    if (frageNr < FRAGEN.length - 1) { frageNr++; darstellen(); scrollTo(0, 0); return; }
    el.disabled = true;
    try {
      await api("profil", { pid, profil: entwurf });
      ich.profil = { ...entwurf };
      ansicht = null; sig = "";
      darstellen(); holen(); scrollTo(0, 0);
    } catch (err) { meldung = err.message; darstellen(); }
    return;
  }
});

starten();
</script>
