:root {
  color-scheme: only light;
  --grund: #e6e9e4;
  --flaeche: #fbfbf9;
  --flaeche-2: #f0f2ee;
  --tinte: #24292c;
  --tinte-2: #535c61;
  --tinte-3: #7b8489;
  --linie: #ccd2cd;
  --linie-2: #b7bfb9;
  --blau: #2556a6;
  --blau-hell: #e3ebf7;
  --braun: #7a4a2b;
  --gruen: #1d8a4e;
  --gruen-hell: #e2f1e7;
  --gruen-text: #136338;
  --gelb: #e3a316;
  --gelb-hell: #fbf0d3;
  --gelb-text: #6f4d00;
  --rot: #c8392d;
  --rot-hell: #f8e3e0;
  --rot-text: #9c2219;
  --wartet: #6b7479;
  --kopf: #24292c;
  --kopf-2: #3a4145;
  --kopf-text: #f3f5f2;
  --kopf-leise: #aab3b7;
  --text: "Atkinson Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --titel: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --rund-gross: 16px;
  --rund: 12px;
  --rund-klein: 8px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--tinte);
  font-family: var(--text);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
img, svg { display: block; }
.unsichtbar { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--blau); outline-offset: 3px; border-radius: 6px; }
h1[tabindex="-1"]:focus { outline: none; }

/* ---------- Kopf: Anzeigen und Leitung ---------- */
.kopf {
  position: sticky; top: 0; z-index: 20;
  background: var(--kopf);
  color: var(--kopf-text);
  padding: 10px 16px 8px;
  padding-top: max(10px, env(safe-area-inset-top));
}
.kopf[hidden] { display: none; }
.kopf-innen { max-width: 520px; margin: 0 auto; }
.anzeigen { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 8px; align-items: start; }
.anzeige { display: flex; gap: 7px; align-items: flex-start; min-width: 0; border-radius: 8px; padding: 3px 4px 3px 2px; transition: background-color .5s; }
.anzeige .ic { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 3px; color: var(--kopf-leise); }
.anzeige b { display: block; font-family: var(--titel); font-weight: 700; font-size: 21px; line-height: 1.05; letter-spacing: .01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.anzeige small { display: block; font-size: 12.5px; line-height: 1.25; color: var(--kopf-leise); white-space: nowrap; }
.anzeige.blitz-rot { background: rgba(200, 57, 45, .45); }
.anzeige.blitz-gruen { background: rgba(29, 138, 78, .45); }
.zeitleiste { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
.zeitleiste .spur { position: relative; flex: 1; height: 4px; border-radius: 2px; background: var(--kopf-2); overflow: hidden; }
.zeitleiste .spur i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--kopf-leise); border-radius: 2px; transition: width .7s ease, background-color .4s; }
.zeitleiste.knapp .spur i { background: var(--gelb); }
.zeitleiste.vorbei .spur i { background: var(--rot); }
.zeitleiste svg { width: 20px; height: 12px; color: var(--kopf-leise); flex: 0 0 auto; }
.zeitleiste.vorbei svg { color: #ff8a7f; }
.zeitleiste.geschafft .spur i { background: #3ccf7a; }
.zeitleiste.geschafft svg { color: #7fe0a6; }
.sterne { display: flex; gap: 1px; margin-top: 2px; }
.sterne svg { width: 17px; height: 17px; }
.anzeige-sterne { flex-direction: column; gap: 1px; align-items: flex-start; }
.anzeige-sterne small { margin-top: 1px; }

.leitung { margin-top: 8px; }
.leitung svg { width: 100%; height: auto; overflow: visible; }
.leitung .zeichnen path { stroke-dasharray: 64; stroke-dashoffset: 64; animation: zeichnen .6s ease-out forwards; }
.leitung .zeichnen .funke { animation: funke .7s .45s ease-out both; stroke-dasharray: none; stroke-dashoffset: 0; }
.leitung .einblenden { animation: einblenden .5s ease both; }
@keyframes zeichnen { to { stroke-dashoffset: 0; } }
@keyframes funke { 0% { opacity: 0; } 30% { opacity: 1; } 55% { opacity: .2; } 100% { opacity: 1; } }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Bühne ---------- */
.buehne { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
.buehne:focus { outline: none; }
.bildschirm { animation: rein .35s ease both; }
@keyframes rein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--titel); font-weight: 700; line-height: 1.08; margin: 0; letter-spacing: .005em; text-wrap: balance; }
h1 { font-size: 36px; }
h2 { font-size: 24px; }
h3 { font-size: 20px; }
p { margin: 0; }
.leise { color: var(--tinte-2); }

/* ---------- Start ---------- */
.marke { display: flex; align-items: center; gap: 10px; font-family: var(--titel); font-weight: 600; font-size: 17px; color: var(--tinte-2); }
.adern { display: grid; grid-template-rows: repeat(5, 3px); gap: 2px; width: 30px; }
.adern i { display: block; border-radius: 2px; }
.start h1 { font-size: 46px; margin-top: 14px; line-height: .98; }
.start .unterzeile { font-size: 19px; margin-top: 10px; color: var(--tinte-2); max-width: 30ch; }
.held { margin: 20px -16px 0; }
.held svg { width: 100%; height: auto; }
.block { margin-top: 24px; }
.block > h2 { margin-bottom: 8px; }
.block p + p { margin-top: 10px; }
.ziele { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.ziele li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 10px 14px 10px 10px; }
.ziele .ic-gross { width: 36px; height: 36px; border-radius: 9px; background: var(--tinte); color: #fff; display: grid; place-items: center; }
.ziele .ic-gross svg { width: 22px; height: 22px; }
.regeln { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.regeln li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.regeln li svg { width: 22px; height: 22px; margin-top: 2px; color: var(--tinte-2); }
.legende { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.legende li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; }
.legende svg { width: 58px; height: 20px; }
.legende b { font-family: var(--titel); font-size: 18px; font-weight: 700; display: block; line-height: 1.1; }
.legende span { font-size: 15px; color: var(--tinte-2); }
.fussnote { margin-top: 26px; font-size: 13.5px; color: var(--tinte-3); }
.knopfreihe { display: grid; gap: 10px; margin-top: 26px; }

/* ---------- Knöpfe ---------- */
.los {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 58px; padding: 10px 18px;
  border: 0; border-radius: var(--rund);
  background: var(--tinte); color: #fff;
  font-family: var(--titel); font-weight: 700; font-size: 23px; line-height: 1.1; letter-spacing: .01em; text-align: center;
  cursor: pointer;
  transition: transform .12s ease, background-color .2s, opacity .2s;
}
.los:active { transform: scale(.985); }
.los[disabled] { background: var(--linie-2); color: var(--flaeche); cursor: not-allowed; }
.los.zweit { background: transparent; color: var(--tinte); border: 2px solid var(--tinte); min-height: 52px; font-size: 21px; }
.klebt { padding: 14px 0 max(14px, env(safe-area-inset-bottom)); margin-top: 6px; z-index: 5; }
.klebt.aktiv { position: sticky; bottom: 0; background: linear-gradient(to bottom, rgba(230, 233, 228, 0), var(--grund) 24%); }

/* ---------- Station ---------- */
.stationskopf { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.nr-klemme { position: relative; width: 48px; height: 48px; border-radius: 9px; background: var(--tinte); color: #fff; display: grid; place-items: center; font-family: var(--titel); font-weight: 700; font-size: 30px; line-height: 1; }
.nr-klemme::after { content: ""; position: absolute; left: -16px; top: 50%; width: 16px; height: 4px; margin-top: -2px; background: var(--tinte); border-radius: 2px 0 0 2px; }
.stationskopf h1 { font-size: 38px; }
.stationskopf .von { display: block; font-family: var(--titel); font-weight: 600; font-size: 17px; color: var(--tinte-2); letter-spacing: .01em; margin-top: 1px; }
.rolle { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; margin-top: 16px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--flaeche-2); border: 2px solid var(--flaeche); box-shadow: 0 0 0 1px var(--linie); }
.avatar svg { width: 100%; height: 100%; }
.rolle b { display: block; font-size: 17px; line-height: 1.25; }
.rolle span { display: block; font-size: 14.5px; color: var(--tinte-2); line-height: 1.3; }
.szene { margin: 16px 0 0; border-radius: var(--rund-gross); overflow: hidden; background: #dfe5e0; box-shadow: 0 0 0 1px var(--linie); }
.szene svg { width: 100%; height: auto; }
.situation { margin-top: 16px; font-size: 17.5px; }
.situation + .situation { margin-top: 10px; }

/* Möglichkeiten als Klemmleiste */
.optionen { border: 0; margin: 22px 0 0; padding: 0; min-width: 0; }
.optionen legend { padding: 0; font-family: var(--titel); font-weight: 700; font-size: 25px; line-height: 1.1; margin-bottom: 4px; }
.optionen .tipp { font-size: 14.5px; color: var(--tinte-2); margin-bottom: 4px; }
.option {
  position: relative;
  display: grid; grid-template-columns: 46px 1fr;
  margin-top: 10px;
  background: var(--flaeche);
  border: 2px solid var(--linie);
  border-radius: 10px;
  cursor: pointer;
  min-height: 66px;
  transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.option input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.option .klemme {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: #dde2de;
  border-right: 2px solid var(--linie);
  border-radius: 8px 0 0 8px;
  font-family: var(--titel); font-weight: 700; font-size: 22px; line-height: 1; color: var(--tinte);
  transition: background-color .15s, color .15s, border-color .15s;
}
.option .schraube { width: 13px; height: 13px; border-radius: 50%; background: #c3c9c5; box-shadow: inset 0 0 0 1.5px #aab2ad; position: relative; }
.option .schraube::after { content: ""; position: absolute; left: 2px; right: 2px; top: 50%; height: 1.6px; margin-top: -.8px; background: #8d9692; transform: rotate(-35deg); }
.option .otext { padding: 12px 14px 12px 14px; font-size: 16.5px; line-height: 1.45; align-self: center; }
.option::before {
  content: ""; position: absolute; left: -14px; top: 50%; height: 5px; width: 0; margin-top: -2.5px;
  background: var(--blau); border-radius: 3px 0 0 3px;
  transition: width .2s ease;
}
.option:hover { border-color: var(--linie-2); }
.option:has(input:focus-visible) { outline: 3px solid var(--blau); outline-offset: 3px; }
.option.gewaehlt { border-color: var(--blau); background: #fff; box-shadow: 0 2px 0 0 rgba(37, 86, 166, .15); }
.option.gewaehlt .klemme { background: var(--blau); color: #fff; border-right-color: var(--blau); }
.option.gewaehlt .schraube { background: #fff; box-shadow: inset 0 0 0 1.5px #c8d6ee; }
.option.gewaehlt .schraube::after { background: var(--blau); transform: rotate(0deg); }
.option.gewaehlt::before { width: 14px; }
.optionen.gesperrt .option { cursor: default; }
.optionen.gesperrt .option:not(.gewaehlt) { opacity: .45; }

/* ---------- Zeitsprung ---------- */
.zeitsprung-kopf { display: grid; grid-template-columns: 104px 1fr; gap: 18px; align-items: center; }
.abreiss { position: relative; width: 104px; height: 120px; perspective: 600px; }
.abreiss .ringe { position: absolute; left: 0; right: 0; top: -6px; display: flex; justify-content: space-around; padding: 0 22px; z-index: 3; }
.abreiss .ringe i { width: 7px; height: 14px; border-radius: 4px; background: #8d9692; box-shadow: inset 0 0 0 1.5px #6f777b; }
.abreiss .rumpf { position: absolute; inset: 0; border-radius: 10px; background: #d2d8d3; box-shadow: 0 3px 0 #b9c0bb; }
.blatt {
  position: absolute; inset: 0 0 4px 0; border-radius: 10px; overflow: hidden;
  background: #fff; box-shadow: 0 0 0 1px var(--linie);
  display: flex; flex-direction: column; align-items: center;
  transform-origin: 50% 0;
  backface-visibility: hidden;
}
.blatt .wt { width: 100%; background: var(--tinte); color: #fff; text-align: center; font-family: var(--titel); font-weight: 700; font-size: 17px; line-height: 1.1; padding: 9px 0 6px; }
.blatt .zahl { font-family: var(--titel); font-weight: 700; font-size: 50px; line-height: 1; margin-top: 7px; font-variant-numeric: tabular-nums; }
.blatt .mon { font-family: var(--titel); font-weight: 600; font-size: 16px; line-height: 1.1; color: var(--tinte-2); margin-top: 3px; }
.blatt.weg { animation: abreissen .26s ease-in forwards; }
@keyframes abreissen { to { transform: rotateX(-110deg) translateY(-6px); opacity: 0; } }
.zeitsprung-kopf .spanne { font-family: var(--titel); font-weight: 700; font-size: 28px; line-height: 1.05; }
.zeitsprung-kopf .wann { margin-top: 4px; color: var(--tinte-2); font-size: 15.5px; }
.zeitsprung-kopf .verzug-hinweis { margin-top: 8px; display: inline-flex; }

.ihre-wahl { margin-top: 20px; padding: 12px 14px 12px 16px; border-left: 4px solid var(--blau); background: var(--blau-hell); border-radius: 0 var(--rund-klein) var(--rund-klein) 0; }
.ihre-wahl span { display: block; font-size: 13.5px; color: var(--blau); font-weight: 700; }
.ihre-wahl p { font-size: 15.5px; margin-top: 2px; }

.karten { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.karte {
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund);
  padding: 14px 16px 14px;
}
.karte.verborgen { visibility: hidden; }
.karte.zeigen { animation: kartein .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes kartein { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.karte-kopf { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
.karte-kopf svg { width: 54px; height: 20px; }
.karte-kopf h3 { font-size: 20px; }
.karte-kopf .rueck { display: block; font-family: var(--text); font-size: 13px; font-weight: 700; color: var(--rot-text); margin-bottom: 1px; }
.karte p { font-size: 16.5px; }
.karte.gruen { background: var(--gruen-hell); border-color: #b9dcc6; }
.karte.gelb { background: var(--gelb-hell); border-color: #ecd395; }
.karte.rot { background: var(--rot-hell); border-color: #ecbab4; }
.karte.folge { border: 2px solid var(--rot); }
.karte.wartet { background: var(--flaeche); border-style: dashed; border-color: var(--linie-2); }
.karte-fuss { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 14px; font-weight: 700; line-height: 1.2; background: #fff; border: 1px solid var(--linie); }
.chip svg { width: 15px; height: 15px; }
.chip.gruen { color: var(--gruen-text); border-color: #a9d3b8; }
.chip.gelb { color: var(--gelb-text); border-color: #e5c477; }
.chip.rot { color: var(--rot-text); border-color: #e3a49d; }
.chip.wartet { color: var(--tinte-2); border-style: dashed; }
.chip.wert { font-family: var(--titel); font-size: 16px; font-weight: 700; padding: 3px 10px 3px 8px; }
.chip.wert.schlecht { color: var(--rot-text); }
.chip.wert.gut { color: var(--gruen-text); }

/* ---------- Zettel, Mails, Bewertungen ---------- */
.mail { margin-top: 16px; background: #fff; border-radius: var(--rund); box-shadow: 0 0 0 1px var(--linie), 0 10px 24px -14px rgba(36, 41, 44, .35); overflow: hidden; }
.mail-kopf { padding: 12px 16px; border-bottom: 1px solid var(--linie); font-size: 14.5px; color: var(--tinte-2); display: grid; gap: 2px; }
.mail-kopf b { color: var(--tinte); }
.mail-text { padding: 14px 16px 16px; display: grid; gap: 9px; font-size: 16.5px; }
.bewertung { margin-top: 16px; background: #fff; border-radius: var(--rund); box-shadow: 0 0 0 1px var(--linie); padding: 16px; }
.bewertung .wer { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.bewertung .wer .avatar { width: 40px; height: 40px; }
.bewertung .wer b { display: block; font-size: 16px; }
.bewertung .wer span { font-size: 13.5px; color: var(--tinte-2); }
.bewertung .sterne { margin-top: 10px; }
.bewertung .sterne svg { width: 24px; height: 24px; }
.bewertung blockquote { margin: 8px 0 0; font-size: 17px; }

/* ---------- Bilanz ---------- */
.bilanz { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.bilanz li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 12px 14px 12px 12px; }
.bilanz .ic-gross { width: 44px; height: 44px; border-radius: 10px; background: var(--tinte); color: #fff; display: grid; place-items: center; }
.bilanz .ic-gross svg { width: 26px; height: 26px; }
.bilanz b { display: block; font-family: var(--titel); font-weight: 700; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.bilanz span { display: block; font-size: 14.5px; color: var(--tinte-2); line-height: 1.35; margin-top: 2px; }
.bilanz .sterne svg { width: 22px; height: 22px; }

.kette { list-style: none; margin: 14px 0 0; padding: 0; }
.kette li { display: grid; grid-template-columns: 34px 40px 1fr; column-gap: 10px; min-height: 64px; }
.kette .knoten { grid-column: 1; display: flex; flex-direction: column; align-items: center; }
.kette .knoten .nr { width: 30px; height: 30px; border-radius: 7px; background: var(--tinte); color: #fff; display: grid; place-items: center; font-family: var(--titel); font-weight: 700; font-size: 18px; flex: 0 0 auto; }
.kette .knoten svg { width: 22px; flex: 1 1 auto; min-height: 34px; }
.kette .avatar { grid-column: 2; width: 40px; height: 40px; }
.kette .was { grid-column: 3; padding-bottom: 12px; }
.kette .was b { font-family: var(--titel); font-size: 19px; font-weight: 700; display: block; line-height: 1.15; }
.kette .was span { display: block; font-size: 15px; line-height: 1.35; }
.kette .was .chip { display: inline-flex; margin-top: 6px; }
.kette .was .nachher { display: block; font-size: 13.5px; color: var(--tinte-2); margin-top: 4px; }
.kette .ende-knoten .nr { background: var(--flaeche); color: var(--tinte); box-shadow: inset 0 0 0 2px var(--tinte); }
.kette .ende-knoten { min-height: 0; }

.protokoll { margin-top: 24px; background: var(--tinte); color: #fff; border-radius: var(--rund-gross); padding: 18px 18px 20px; }
.protokoll h2 { font-size: 24px; }
.protokoll ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 8px; }
.protokoll li::marker { font-family: var(--titel); font-weight: 700; }

/* ---------- Ablaufdiagramm ---------- */
.ablauf { margin: 14px 0 0; background: #fff; border-radius: var(--rund); box-shadow: 0 0 0 1px var(--linie); overflow: hidden; }
.ablauf svg { width: 100%; height: auto; }
.bildzeile { margin-top: 8px; font-size: 14.5px; color: var(--tinte-2); }
.ablauf-klapp { margin-top: 14px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); }
.ablauf-klapp summary { cursor: pointer; padding: 11px 14px; font-family: var(--titel); font-weight: 700; font-size: 18px; line-height: 1.2; list-style: none; display: flex; align-items: center; gap: 12px; min-height: 46px; }
.ablauf-klapp summary::-webkit-details-marker { display: none; }
.ablauf-klapp summary::before { content: ""; flex: 0 0 auto; width: 8px; height: 8px; margin-left: 2px; border-right: 2.5px solid var(--tinte); border-bottom: 2.5px solid var(--tinte); transform: rotate(-45deg); transition: transform .2s; }
.ablauf-klapp[open] summary::before { transform: rotate(45deg); }
.ablauf-klapp .ablauf { margin: 0 10px 10px; }
.ablauf-schritt { margin-top: 18px; }
.ablauf-titel { font-size: 16px; }
.ablauf-schritt .ablauf { margin-top: 8px; }
.ablauf .zeichnen .lin { stroke-dasharray: 420; stroke-dashoffset: 420; animation: zeichnen .9s ease-out forwards; }
.ablauf .zeichnen .spitze, .ablauf .zeichnen .funke { animation: einblenden .35s .8s both; }
.ablauf .einblenden { animation: einblenden .5s ease both; }
h3.zwischen { margin-top: 22px; font-size: 21px; }

/* ---------- Bewegung reduzieren ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media (max-width: 359px) {
  .anzeigen { grid-template-columns: 1.15fr .9fr 1fr; gap: 4px; }
  .anzeige { gap: 4px; }
  .anzeige .ic { display: none; }
  .anzeige b { font-size: 18px; }
  .anzeige small { font-size: 11.5px; }
  .sterne svg { width: 14px; height: 14px; }
  h1 { font-size: 32px; }
  .start h1 { font-size: 40px; }
  .stationskopf h1 { font-size: 33px; }
}
@media (min-width: 600px) {
  .buehne { padding-top: 28px; }
  .held { margin: 22px 0 0; border-radius: var(--rund-gross); overflow: hidden; box-shadow: 0 0 0 1px var(--linie); }
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="halb" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width=".5" height="1"/></clipPath></defs></svg>

<header class="kopf" id="kopf" hidden>
  <div class="kopf-innen">
    <div class="anzeigen">
      <div class="anzeige" id="a-datum">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.4"/><path d="M3.5 10 H20.5 M8 3 V7 M16 3 V7"/></svg>

            text: "Kaya hat die Mappe drei Tage im Wagen, bevor er sie durchsieht. Geändert hat er nichts. Dann liegt sie bei Lena.",
            kurz: "Umweg über Kaya, drei Tage",
          }),
        },
      ],
    },
    {
      nr: 8, id: "rechnung", titel: "Rechnung", rolle: "lena", ort: "Büro", uhr: "10:30 Uhr", bild: "rechnung",
      normal: 0, pruefung: 9, empfaenger: "Frau Brüning", karteTitel: "Bei Frau Brüning kommt an",
      situation: (s) =>
        `Der Auftrag Brüning ist abgeschlossen. Sie schreiben die Rechnung. Im Auftrag liegen das Angebot über ${euro(s.flags.preis || 2240)} als Festpreis, der Arbeitsbericht ${s.flags.nachtrag ? "mit dem unterschriebenen Mehraufwand von 180 Euro" : "ohne Besonderheiten"}, das Prüfprotokoll und die Fotos.`,
      frage: "Wie schreiben Sie die Rechnung?",
      optionen: [

          folge: (s) =>

              ? { tage: 0, kosten: 180, text: "Die Rechnung geht noch am selben Tag raus, genau nach Angebot. Der unterschriebene Mehraufwand fehlt darin: 180 Euro verschenkt.", kurz: "Rechnung ohne Arbeitsbericht, 180 € verschenkt" }
              : { tage: 0, text: "Die Rechnung geht noch am selben Tag raus, genau nach Angebot. Verloren ging diesmal nichts, weil im Arbeitsbericht nichts Zusätzliches stand. Hätte dort etwas gestanden, wäre es jetzt weg.", kurz: "Rechnung ohne Blick in den Arbeitsbericht" },
        },

  /* ---------- Nachspiel: Beschwerde oder Bewertung ---------- */
  const BESCHWERDE_AB = 6; /* höchstens 3 Sterne (in halben gezählt) → Beschwerde */

  function beschwerdeSaetze(s) {
    const f = s.flags, saetze = [];
    if (f.rueckrufSpaet) saetze.push("Nach meinem ersten Anruf hat sich drei Tage lang niemand gemeldet.");
    if (f.nachgemessen) saetze.push("Herr Kaya musste zweimal zum Messen kommen.");
    if (f.terminGeplatzt) saetze.push("Den zugesagten Montagetermin haben Sie wieder abgesagt, obwohl ich extra Urlaub genommen hatte.");
    if (f.leerfahrt) saetze.push("Am Montagetag stand Ihr Monteur ohne Wallbox vor meiner Garage.");
    if (s.autoOhneWallbox > 0) saetze.push(`Mein neues Auto stand ${tageText(s.autoOhneWallbox)} ohne Wallbox in der Garage.`);
    if (f.anmeldungFehlte) saetze.push("In Betrieb gehen durfte die Wallbox erst beim zweiten Termin, weil die Anmeldung fehlte.");
    if (f.mappeWeg) saetze.push("Auf mein Prüfprotokoll habe ich fast zwei Wochen gewartet.");
    return saetze;
  }

  function lobSaetze(s) {
    const f = s.flags, saetze = [];
    if (f.schnellerRueckruf) saetze.push("Schon am Tag meines Anrufs hat sich das Büro gemeldet.");
    if (f.aufmassGut) saetze.push("Beim Aufmaß wurde an alles gedacht.");
    if (f.gezeigt) saetze.push("Bevor der Monteur um die Wasserleitung herumgebaut hat, hat er mir alles gezeigt.");
    if (s.wallboxVorAuto > 0) saetze.push(`Die Wallbox lief schon ${tageText(s.wallboxVorAuto)}, bevor mein neues Auto kam.`);
    if (f.protokollSchnell) saetze.push("Das Prüfprotokoll hatte ich am nächsten Tag.");
    return saetze;
  }

  const NACHSPIEL = {
    rolle: "bernd", ort: "Büro", uhr: "8:05 Uhr", bild: "nachspiel", titel: "Nachspiel",
    frage: "Wie antworten Sie Frau Brüning?",
    optionen: [
      { id: "ausrede", farbe: "rot", text: "Sie erklären ihr freundlich, dass Lieferzeiten und volle Auftragsbücher die Verzögerungen verursacht haben.", sterne: -1, kosten: 0, bewertung: "Ausreden statt Entschuldigung. Nicht noch einmal." , text2: "Frau Brüning antwortet nicht. Zwei Tage später steht ihre Bewertung im Internet." },
      { id: "entschuldigen", farbe: "gruen", text: "Sie entschuldigen sich, nennen die Fehler offen beim Namen und bieten ihr eine Gutschrift von 50 Euro an.", sterne: 2, kosten: 50, bewertung: "Nicht alles lief rund. Aber wie mit den Fehlern umgegangen wurde, fand ich in Ordnung.", text2: "Frau Brüning antwortet: „Danke für die ehrlichen Worte.“ Dann schreibt sie eine Bewertung." },
      { id: "weiterleiten", farbe: "gelb", text: "Sie leiten die E-Mail an Lena weiter. Sie hat den Auftrag betreut und kennt alle Einzelheiten.", sterne: -1, kosten: 0, bewertung: "Auf meine Beschwerde hat eine Woche lang niemand reagiert.", text2: "Lena ist eine Woche im Urlaub. So lange bleibt die E-Mail liegen. Dann schreibt Frau Brüning eine Bewertung." },
    ],
  };

  /* ---------- Zustand ---------- */
  function mischen(liste, zufall) {
    const a = liste.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(zufall() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function neuesSpiel(zufall) {
    zufall = zufall || Math.random;
    return {
      version: 1,
      schritt: 0,          /* 0..7 = Stationen, 8 = Nachspiel, 9 = Ende */
      tag: 0, kosten: 0, sterne: 10,
      flags: {},
      wahl: [],            /* gewählte Option je Station */
      segmente: STATIONEN.map(() => ({ zustand: "offen", kurz: "" })),
      reihenfolge: STATIONEN.map((st) => mischen(st.optionen.map((o) => o.id), zufall)).concat([mischen(NACHSPIEL.optionen.map((o) => o.id), zufall)]),
      montageTag: null, autoOhneWallbox: 0, wallboxVorAuto: 0,
      nachspiel: null,     /* { art: "beschwerde"|"lob", wahl, bewertung } */
      fertig: false,
    };
  }

  function klemm(s) { s.sterne = Math.max(2, Math.min(10, s.sterne)); }

  /* Eine Wirkung anwenden und als Karte festhalten */
  function wirkung(s, karte, w) {
    karte.delta = { tage: w.tage || 0, kosten: w.kosten || 0, sterne: w.sterne || 0 };
    s.tag += karte.delta.tage;
    s.kosten += karte.delta.kosten;
    s.sterne += karte.delta.sterne;
    klemm(s);
    if (w.setze) Object.assign(s.flags, w.setze);
    karte.stand = { tag: s.tag, kosten: s.kosten, sterne: s.sterne };
    return karte;
  }

  function aufdecken(s, nr) {
    const seg = s.segmente[nr - 1];
    seg.zustand = seg.farbe;
  }

  /* Entscheidung an der aktuellen Station. Liefert die Karten für den Zeitsprung. */
  function entscheiden(s, optionId) {
    const i = s.schritt;
    const st = STATIONEN[i];
    const opt = st.optionen.find((o) => o.id === optionId);
    if (!opt) throw new Error("Unbekannte Option " + optionId);
    s.wahl[i] = optionId;
    const vonTag = s.tag;
    const karten = [];
    const f = opt.folge(s);

    /* Folge, die schon vor dem eigentlichen Ergebnis eintritt (Rückfrage an eine frühere Station) */
    if (f.vorher) {
      const v = f.vorher;
      karten.push(wirkung(s, { art: "folge", station: v.station, farbe: "rot", text: v.text }, v));
      s.segmente[v.station - 1].nachwirkung = true;
    }

    const seg = s.segmente[i];
    seg.farbe = opt.farbe;
    seg.kurz = f.kurz;
    seg.optionText = opt.text;
    seg.zustand = st.pruefung === st.nr + 1 || st.pruefung === 9 ? opt.farbe : "wartet";
    const haupt = { art: "ergebnis", station: st.nr, farbe: seg.zustand, text: f.text, wahl: opt.text, normal: st.normal, titel: st.karteTitel };
    if (seg.zustand === "wartet") haupt.wartetText = st.wartetText;
    karten.push(wirkung(s, haupt, f));
    /* Verzug gegenüber dem normalen Ablauf, damit grüne Wege nicht wie Strafen aussehen */
    haupt.verzug = (f.tage || 0) - st.normal;

    const naechste = st.nr + 1;

    /* Aufgeschobene Prüfungen, die jetzt fällig sind */
    STATIONEN.forEach((alt, k) => {
      if (k >= i) return;
      if (alt.pruefung === naechste && s.segmente[k].zustand === "wartet") {
        const altOpt = alt.optionen.find((o) => o.id === s.wahl[k]);
        const p = altOpt.pruefung ? altOpt.pruefung(s) : { text: "" };
        aufdecken(s, alt.nr);
        karten.push(wirkung(s, { art: "pruefung", station: alt.nr, farbe: altOpt.farbe, text: p.text }, p));
      }
    });

    /* Späte Folgen früherer Entscheidungen */
    if (naechste === 5 && s.flags.terminFehlt) {
      karten.push(wirkung(s, { art: "folge", station: 1, farbe: "rot", text: "Kaya plant die Montage. Im Auftrag steht kein Wunschtermin, vom 7. Dezember weiß er nichts. Also kommt Frau Brüning hinter drei andere Aufträge." }, { tage: 3 }));
      s.segmente[0].nachwirkung = true;
    }
    if (naechste === 6) {
      s.montageTag = s.tag;
      if (s.montageTag > AUTO_TAG) {
        s.autoOhneWallbox = kalendertage(AUTO_TAG, s.montageTag);
        karten.push(wirkung(s, { art: "auto", station: null, farbe: "rot", text: `Seit dem 7. Dezember steht Frau Brünings neues Auto in der Garage. Bis die Wallbox läuft, lädt sie an der Haushaltssteckdose. Eine volle Ladung dauert dort mehr als einen Tag.` }, { sterne: -2 }));
      } else {
        s.wallboxVorAuto = kalendertage(s.montageTag, AUTO_TAG);
      }
    }
    if (naechste === 7 && s.flags.aufmassLuecke) {
      const extra = s.flags.angebotZuNiedrig ? 300 : 0;
      karten.push(wirkung(s, {
        art: "folge", station: 2, farbe: "rot",
        text: "Beim Verlegen merken Sie: Die Leitung reicht nicht. Im Aufmaß standen „ca. 18 m“, gebraucht werden 26 Meter. Für die Kernbohrung fehlt außerdem der Bohrer. Sie fahren zum Großhandel." +
          (extra ? " Und weil im Angebot nur 18 Meter und keine Kernbohrung stehen, zahlt Terhorst auch dort 300 Euro drauf." : ""),
      }, { kosten: 160 + extra }));
      karten.push(wirkung(s, {
        art: "folge", station: 2, farbe: "rot",
        text: "Dann wollen Sie die Wallbox in Betrieb nehmen. Das dürfen Sie nicht: Sie ist beim Netzbetreiber nicht angemeldet. Für die Anmeldung fehlten Zählernummer und Foto vom Zählerschrank. Lena holt das nach, Sie müssen zwei Tage später noch einmal kommen.",
      }, { tage: 2, kosten: 90, sterne: -1, setze: { anmeldungFehlte: true } }));
      s.segmente[1].nachwirkung = true;
    }

    /* Weiter */
    s.schritt = i + 1;
    if (s.schritt === 8) {
      /* Nach der Rechnung: Nachspiel festlegen */
      s.nachspiel = { art: s.sterne <= BESCHWERDE_AB ? "beschwerde" : "lob", wahl: null };
      if (s.nachspiel.art === "lob") {
        s.nachspiel.saetze = lobSaetze(s);
      } else {
        s.nachspiel.saetze = beschwerdeSaetze(s);
      }
    }
    return { karten, vonTag, bisTag: s.tag };
  }

  function nachspielEntscheiden(s, optionId) {
    const opt = NACHSPIEL.optionen.find((o) => o.id === optionId);
    s.nachspiel.wahl = optionId;
    s.kosten += opt.kosten;
    s.sterne += opt.sterne;
    if (optionId === "entschuldigen") s.sterne = Math.min(s.sterne, 8);
    klemm(s);
    s.nachspiel.bewertung = opt.bewertung;
    s.nachspiel.text2 = opt.text2;
    s.schritt = 9;
    s.fertig = true;
    return { option: opt };
  }

  function lobAbschliessen(s) {
    s.schritt = 9;
    s.fertig = true;
  }

  function bilanz(s) {
    const zaehl = { gruen: 0, gelb: 0, rot: 0 };
    s.segmente.forEach((g) => { if (zaehl[g.farbe] !== undefined) zaehl[g.farbe]++; });
    return {
      tage: s.tag,
      kosten: s.kosten,
      sterne: s.sterne / 2,
      gewinn: GEWINN_GEPLANT - s.kosten,
      zaehl,
      autoOhneWallbox: s.autoOhneWallbox,
      wallboxVorAuto: s.wallboxVorAuto,
    };
  }

  /* ---------- Ablaufdiagramm: eine Spalte je Stelle, eine Zeile je Schritt ----------
     ein: Nummer der Übergabe (Index der Station), die in diese Zeile führt.
     Ohne ein ist die Verbindung kein Entscheidungspunkt des Spiels. */
  const SPALTEN = [
    { id: "kundin", name: "Kundin", person: "bruening" },
    { id: "chef", name: "Chef", person: "bernd" },
    { id: "buero", name: "Büro", person: "lena" },
    { id: "meister", name: "Meister", person: "kaya" },
    { id: "lager", name: "Lager", person: "kroeger" },
    { id: "monteur", name: "Monteur", person: "tobias" },
  ];
  const ABLAUF = [
    { spalte: "kundin", text: "Anruf" },
    { spalte: "monteur", text: "Anfrage", station: 1 },
    { spalte: "buero", text: "Termin für das Aufmaß", ein: 0 },
    { spalte: "meister", text: "Aufmaß", station: 2 },
    { spalte: "buero", text: "Angebot", station: 3, ein: 1 },
    { spalte: "kundin", text: "Angebot annehmen", ein: 2 },
    { spalte: "buero", text: "Auftrag", station: 4 },
    { spalte: "meister", text: "Arbeitsvorbereitung", station: 5, ein: 3 },
    { spalte: "lager", text: "Material bestellen", ein: 4 },
    { spalte: "monteur", text: "Montage", station: 6, ein: 4 },
    { spalte: "monteur", text: "Unterlagen", station: 7, ein: 5 },
    { spalte: "buero", text: "Rechnung", station: 8, ein: 6 },
    { spalte: "kundin", text: "Wallbox läuft", ein: 7 },
  ];
  /* Gelbe Umwege erscheinen als zusätzlicher Schritt in einer anderen Spalte */
  const UMWEGE = {
    1: { chef: { spalte: "chef", text: "Umweg über den Chef" } },
    2: { papier: { spalte: "meister", text: "Checkliste im Wagen" } },
    3: { chef: { spalte: "chef", text: "Freigabe beim Chef" } },
    4: { postfach: { spalte: "meister", text: "Liegt im Postfach" } },
    5: { selbst: { spalte: "monteur", text: "Abholung Großhandel", ersetzt: true } },
    6: { warten: { spalte: "meister", text: "Warten auf Kaya" } },
    7: { kaya: { spalte: "meister", text: "Mappe bei Kaya" } },
    8: { chef: { spalte: "chef", text: "Freigabe beim Chef" } },
  };

  /* Zeilen des Diagramms. Ohne Spielstand: geplanter Ablauf. Mit Spielstand: tatsächlicher Weg. */
  function ablaufZeilen(s) {
    const zeilen = [];
    const ersteMitEin = {};
    ABLAUF.forEach((z, i) => { if (z.ein !== undefined && ersteMitEin[z.ein] === undefined) ersteMitEin[z.ein] = i; });
    ABLAUF.forEach((z, i) => {
      if (s && z.ein !== undefined && ersteMitEin[z.ein] === i) {
        const st = STATIONEN[z.ein];
        const wahl = s.wahl[z.ein];
        const um = wahl && UMWEGE[st.nr] && UMWEGE[st.nr][wahl];
        if (um) {
          zeilen.push({ spalte: um.spalte, text: um.text, extra: true, ein: z.ein });
          if (um.ersetzt) return;
        }
      }
      zeilen.push(Object.assign({}, z));
    });
    /* Zustand jeder Verbindung und jedes Schritts */
    const schritt = s ? s.schritt : null;              /* entschiedene Stationen */
    const gebrochen = {};
    let erreichtBis = -1;
    if (s) {
      const aktuelleNr = Math.min(schritt + 1, 9);
      zeilen.forEach((z, i) => { if (z.station && z.station <= Math.min(aktuelleNr, 8)) erreichtBis = i; });
      if (schritt >= 8) erreichtBis = zeilen.length - 1;
    }
    zeilen.forEach((z, i) => {
      if (z.station) z.stand = !s ? "soll" : z.station <= schritt ? "erledigt" : z.station === schritt + 1 ? "aktuell" : "kommt";
      else z.stand = !s ? "soll" : i <= erreichtBis ? "erledigt" : "kommt";
      if (i === 0) return;
      if (!s) { z.linie = "soll"; return; }
      if (z.ein !== undefined) {
        const zustand = s.segmente[z.ein].zustand;
        z.linie = zustand;
        if (zustand === "rot" && !gebrochen[z.ein]) { z.bruch = true; gebrochen[z.ein] = true; }
      } else {
        z.linie = i <= erreichtBis ? "neutral" : "offen";
      }
    });
    return zeilen;
  }

  const Motor = {
    START, AUTO_TAG, GEWINN_GEPLANT, PERSONEN, FARBEN, STATIONEN, NACHSPIEL, BESCHWERDE_AB,
    SPALTEN, ABLAUF, UMWEGE,
    datumVon, kalender, datum, datumKurz, kalendertage, tageText, euro,
    neuesSpiel, entscheiden, nachspielEntscheiden, lobAbschliessen, bilanz, ablaufZeilen,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = Motor;
  else wurzel.Motor = Motor;
})(typeof window !== "undefined" ? window : globalThis);

(function () {

  /* ---------- Personen ---------- */
  const LEUTE = {

    kaya: { haut: "#c68c66", haar: "#2a2321", frisur: "kurz", oben: "#4e6a87", unten: "#2f3437", brille: true, bart: true, logo: true },

  /* Kopf mit Haaren und Gesicht; Ursprung = Kopfmitte, Radius 12 */
  function kopf(p) {
    const h = p.haar;
    let hinten = "", vorne = "";
    switch (p.frisur) {
      case "kurz":
        vorne = `<path d="M-12.4 -2.5 C-13.6 -13 -6 -16.4 1 -15.8 C8.5 -15.2 13.4 -10 12.6 -2.5 C10.6 -7.2 6 -9.6 0 -9.4 C-5.6 -9.2 -9.6 -7 -12.4 -2.5 Z" fill="${h}"/>`;

      case "zopf":
        hinten = `<ellipse cx="12.5" cy="3" rx="5" ry="10" transform="rotate(18 12.5 3)" fill="${h}"/><circle cx="11" cy="-7.5" r="2.6" fill="${p.oben}"/>`;
        vorne = `<path d="M-12.6 -0.5 C-14 -13.4 -5 -16.6 1.5 -16 C9.6 -15.2 13.8 -9 12.6 0 C11.6 -6.4 7 -10 0.5 -10 C-6 -10 -10.6 -6.4 -12.6 -0.5 Z" fill="${h}"/>`;
        break;
      case "bob":
        hinten = `<path d="M-14 -2 C-15 -14 -6.5 -17 0 -17 C6.5 -17 15 -14 14 -2 L14.6 9 C10 10.6 -10 10.6 -14.6 9 Z" fill="${h}"/>`;
        vorne = `<path d="M-12.8 1 C-13.4 -11 -7 -15.6 0 -15.6 C7 -15.6 13.4 -11 12.8 1 C11 -4 9 -8.8 1.6 -9.8 C-4.4 -8.6 -9.8 -6.2 -12.8 1 Z" fill="${h}"/>`;

        vorne = `<path d="M-12.6 -1 C-12.8 -5 -11.6 -7.6 -10 -8.8 L-9.2 -2.4 Z M12.6 -1 C12.8 -5 11.6 -7.6 10 -8.8 L9.2 -2.4 Z" fill="${h}"/>`;

    }

  /* Ganze Figur von vorn. x/y = Mitte zwischen den Füßen. */

    const hals = `<rect x="-4" y="-98" width="8" height="8" rx="2" fill="${schattieren(p.haut, -0.08)}"/>`;

        vorArm = `<g transform="rotate(-6 0 -68)"><rect x="-15" y="-80" width="30" height="21" rx="2.5" fill="${F.tinte}"/><rect x="-12.6" y="-77.6" width="25.2" height="16.2" rx="1" fill="#a9c6e3"/><rect x="-10.6" y="-75.4" width="12" height="2.2" rx="1" fill="#fff" opacity=".8"/><rect x="-10.6" y="-71.4" width="20" height="1.6" rx=".8" fill="#fff" opacity=".6"/><rect x="-10.6" y="-68.4" width="16" height="1.6" rx=".8" fill="#fff" opacity=".6"/></g>` + hand(-9.5, -63.5) + hand(9.5, -63.5);
        break;
      case "greifen":
      case "zeigen": {
        /* ein Arm streckt sich zu (hx, hy); Ellbogen hängt leicht durch */

        const anderer = links ? arm("M16 -85 L19.5 -56") + hand(19.8, -53) : arm("M-16 -85 L-19.5 -56") + hand(-19.8, -53);

        vorArm = hand(hx, hy);

      case "uhr":
        arme = arm("M16 -85 L19.5 -56") + hand(19.8, -53) + arm("M-16 -85 L-19 -68 L-3 -74");
        vorArm = `<rect x="-6.5" y="-77.5" width="5" height="6" rx="1.2" fill="${F.tinte}"/>` + hand(1.5, -74.5);
        break;
      case "mappe":
        arme = arm("M-16 -85 L-19.5 -56") + hand(-19.8, -53) + arm("M16 -85 L20 -66 L6 -70");

        break;

        arme = arm("M-16 -85 L-17 -64 L-11 -60") + arm("M16 -85 L17 -64 L11 -60");
        vorArm = `<rect x="-17" y="-74" width="34" height="22" rx="1.5" fill="${F.karton}"/><rect x="-17" y="-74" width="34" height="4" fill="${F.kartonDunkel}"/><rect x="-3" y="-74" width="6" height="22" fill="#e4cfa3" opacity=".7"/>` + hand(-11, -58) + hand(11, -58);

  /* ---------- Hilfen ---------- */
  function M_TAGE(n) { return n === 1 ? "1 Tag" : `${n} Tage`; }
  function schattieren(hex, anteil) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const z = anteil < 0 ? 0 : 255, a = Math.abs(anteil);
    r = Math.round(r + (z - r) * a); g = Math.round(g + (z - g) * a); b = Math.round(b + (z - b) * a);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  /* Fünf Aderfarben als Firmenzeichen */
  function aderStreifen(b, h) {
    const farben = [F.braun, F.tinte, F.grauAder, F.blau, "gnge"];
    const dh = h / 5;
    return farben.map((c, i) => c === "gnge"
      ? `<rect x="0" y="${i * dh}" width="${b}" height="${dh * 0.8}" fill="${F.gn}"/><rect x="${b * 0.25}" y="${i * dh}" width="${b * 0.18}" height="${dh * 0.8}" fill="${F.ge}"/><rect x="${b * 0.7}" y="${i * dh}" width="${b * 0.18}" height="${dh * 0.8}" fill="${F.ge}"/>`
      : `<rect x="0" y="${i * dh}" width="${b}" height="${dh * 0.8}" fill="${c}"/>`).join("");
  }
  function adern() {
    return `<span class="adern" aria-hidden="true"><i style="background:${F.braun}"></i><i style="background:${F.tinte}"></i><i style="background:${F.grauAder}"></i><i style="background:${F.blau}"></i><i style="background:repeating-linear-gradient(90deg, ${F.gn} 0 5px, ${F.ge} 5px 8px)"></i></span>`;
  }
  function text(x, y, t, opt) {
    opt = opt || {};
    return `<text x="${x}" y="${y}" font-family="${opt.hand ? "Caveat, cursive" : "Barlow Condensed, Arial Narrow, sans-serif"}" font-weight="${opt.w || 700}" font-size="${opt.g || 10}" fill="${opt.f || F.tinte}" ${opt.anker ? `text-anchor="${opt.anker}"` : ""} ${opt.dreh ? `transform="rotate(${opt.dreh} ${x} ${y})"` : ""}>${t}</text>`;

  function wolke(x, y, s) {

  function ablaufdiagramm(zeilen, spalten, opt) {

    let koerper = "";

      const xa = sx[a.spalte], ya = cy[i - 1] + radius(a), xb = sx[z.spalte], yb = cy[i] - radius(z) - 2.5;
      const ym = (cy[i - 1] + cy[i]) / 2;
      const st = LINIE[z.linie] || LINIE.soll;
      const strich = `stroke="${st.c}" stroke-width="${st.w}" fill="none" stroke-linecap="round" stroke-linejoin="round"${st.d ? ` stroke-dasharray="${st.d}"` : ""}`;
      let pfad = "", funke = "";
      if (z.bruch) {
        if (Math.abs(xa - xb) < 0.5) {
          pfad = `<path class="lin" d="M${xa} ${ya} V${ym - 5}" ${strich}/><path class="lin" d="M${xa} ${ym + 5} V${yb}" ${strich}/>`;
          funke = `<path class="funke" d="M${xa - 6} ${ym - 2} L${xa - 1} ${ym + 1.5} L${xa + 1} ${ym - 1.5} L${xa + 6} ${ym + 2}" stroke="${F.rot}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
        } else {
          const xm = (xa + xb) / 2, dir = xb > xa ? 1 : -1;
          pfad = `<path class="lin" d="M${xa} ${ya} V${ym} H${xm - 5 * dir}" ${strich}/><path class="lin" d="M${xm + 5 * dir} ${ym} H${xb} V${yb}" ${strich}/>`;
          funke = `<path class="funke" d="M${xm - 2} ${ym - 6} L${xm + 1.5} ${ym - 1} L${xm - 1.5} ${ym + 1} L${xm + 2} ${ym + 6}" stroke="${F.rot}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
        }
      } else {
        const d = Math.abs(xa - xb) < 0.5 ? `M${xa} ${ya} V${yb}` : `M${xa} ${ya} V${ym} H${xb} V${yb}`;
        pfad = `<path class="lin" d="${d}" ${strich}/>`;
      }
      const spitze = `<path class="spitze" d="M${xb - 4} ${yb - 3.5} L${xb + 4} ${yb - 3.5} L${xb} ${yb + 2.5} Z" fill="${st.c}"/>`;
      const anim = z.ein !== undefined && neu.includes(z.ein) ? (st.d ? "einblenden" : "zeichnen") : "";
      koerper += `<g class="${anim}">${pfad}${funke}${spitze}</g>`;
    });
    /* Schritte */
    zeilen.forEach((z, i) => {
      const y = cy[i], x = sx[z.spalte];
      const leise = z.stand === "kommt";
      /* Beschriftung links */
      if (z.station) {
        const f = z.stand === "aktuell" ? F.blau : leise ? "#c3c9c5" : F.tinte;
        koerper += `<rect x="4" y="${y - 8.5}" width="17" height="17" rx="3.5" fill="${f}"/>${text(12.5, y + 4.4, String(z.station), { g: 12, anker: "middle", f: "#fff" })}`;
        koerper += text(27, y + 4.5, z.text, { g: 12.5, f: leise ? "#8a9499" : F.tinte });
      } else if (z.extra) {
        koerper += `<rect x="8.5" y="${y - 4}" width="8" height="8" transform="rotate(45 12.5 ${y})" fill="${z.linie === "gelb" ? F.gelb : "#9aa3a6"}"/>`;
        koerper += text(27, y + 4.2, z.text, { g: 11.5, w: 600, f: z.linie === "gelb" ? "#7a5300" : "#535c61" });
      } else {
        koerper += `<circle cx="12.5" cy="${y}" r="3.2" fill="#fff" stroke="${leise ? "#c3c9c5" : "#7b8489"}" stroke-width="1.4"/>`;
        koerper += text(27, y + 4.2, z.text, { g: 11.5, w: 600, f: leise ? "#a3abaf" : "#535c61" });
      }
      /* Hilfslinie von der Beschriftung zur Spalte */
      koerper += `<path d="M${L + 2} ${y} H${x - radius(z) - 3}" stroke="#d6dcd7" stroke-width="1" stroke-dasharray="1.5 3"/>`;
      /* Zeichen in der Spalte */
      if (z.station) {
        const fuell = z.stand === "erledigt" ? F.tinte : z.stand === "aktuell" ? F.blau : "#fff";
        const rand = z.stand === "kommt" ? "#c3c9c5" : z.stand === "aktuell" ? F.blau : F.tinte;
        const zahl = z.stand === "erledigt" || z.stand === "aktuell" ? "#fff" : z.stand === "kommt" ? "#a3abaf" : F.tinte;
        if (z.stand === "aktuell") koerper += `<circle cx="${x}" cy="${y}" r="14.5" fill="none" stroke="${F.blau}" stroke-width="1.6" opacity=".35"/>`;
        koerper += `<circle cx="${x}" cy="${y}" r="10" fill="${fuell}" stroke="${rand}" stroke-width="2"/>${text(x, y + 4.3, String(z.station), { g: 12.5, anker: "middle", f: zahl })}`;
      } else if (z.extra) {
        koerper += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${z.linie === "gelb" ? F.gelb : "#9aa3a6"}" stroke="#fff" stroke-width="1.2"/>`;
      } else {
        koerper += `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="${z.stand === "kommt" ? "#c3c9c5" : F.tinte}" stroke-width="1.8"/>`;
      }
    });
    /* Kopf mit den Stellen */
    let kopfteil = `<rect x="0" y="0" width="${B}" height="${kh}" fill="#e6e9e4"/>${text(6, kh - 10, "Schritt", { g: 11.5, w: 600, f: "#535c61" })}`;
    spalten.forEach((sp, i) => {
      const x = sx[sp.id];
      kopfteil += kopfbild(sp.person, x, 20, 13, `${id}k${i}`) + text(x, kh - 8, sp.name, { g: 11, anker: "middle" });
      kopfteil += `<path d="M${L + lw * i} 0 V${kh}" stroke="#d3d8d3" stroke-width="1"/>`;
    });
    /* Ausschnitt oder ganzes Diagramm */
    const von = opt.ausschnitt ? opt.ausschnitt[0] : 0;
    const bis = opt.ausschnitt ? opt.ausschnitt[1] : zeilen.length - 1;
    const y0 = opt.ausschnitt ? cy[von] - 12.5 : cy[von] - rh / 2, y1 = opt.ausschnitt ? cy[bis] + 16 : cy[bis] + rh / 2;
    const hoehe = kh + (y1 - y0);
    return `<svg viewBox="0 0 ${B} ${hoehe}" aria-hidden="true" focusable="false">
      <clipPath id="${id}c"><rect x="0" y="${kh}" width="${B}" height="${hoehe - kh}"/></clipPath>
      <g clip-path="url(#${id}c)"><g transform="translate(0 ${kh - y0})">${koerper}</g></g>
      ${kopfteil}
      <path d="M0 ${kh} H${B}" stroke="#cdd3ce" stroke-width="1.2"/>
    </svg>`;
  }

  window.Bilder = { szene, beschreibung, avatar, icon, stern, punkt, adern, segmentIcon, segmentSenkrecht, leitung, figur, ablaufdiagramm };
})();

</script>
<script>
/* ==========================================================================
   Oberfläche: Bildschirme, Kopfanzeigen, Leitung
   ========================================================================== */
(function () {
  "use strict";
  const M = window.Motor;
  const B = window.Bilder;
  const SPEICHER = "terhorst-wallbox-v1";
  const ruhig = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const buehne = document.getElementById("buehne");
  const kopf = document.getElementById("kopf");
  const ansage = document.getElementById("ansage");

  /* ---------- Speichern ---------- */
  let daten = { spiel: null, ansicht: "start", karten: null, sprung: null };
  function speichern() {
    try { localStorage.setItem(SPEICHER, JSON.stringify(daten)); } catch (e) { /* Privatmodus: ohne Speichern weiter */ }
  }
  function laden() {
    try {
      const roh = localStorage.getItem(SPEICHER);
      if (!roh) return;
      const d = JSON.parse(roh);
      if (d && typeof d === "object") daten = Object.assign(daten, d);
    } catch (e) { /* kaputter Speicher: neu beginnen */ }
  }

  /* ---------- Hilfen ---------- */
  const esc = (t) => String(t).replace(/[&<>"]/g, (z) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));
  const euroZahl = (n) => n.toLocaleString("de-DE") + " €";
  function sterneText(halbe) {
    const ganz = Math.floor(halbe / 2), halb = halbe % 2 ? "½" : "";
    if (halbe === 2) return "1 Stern";
    return (ganz ? String(ganz) : "") + halb + " Sterne";
  }
  function sterneSVG(halbe) {
    let out = "";
    for (let i = 0; i < 5; i++) {
      const rest = halbe - i * 2;
      out += B.stern(rest >= 2 ? "voll" : rest === 1 ? "halb" : "leer");
    }
    return out;
  }
  function tageWort(n) { return n === 1 ? "1 Tag" : `${n} Tage`; }
  /* halbe Sterne als Text: 1 → „½ Stern“, 2 → „1 Stern“, 3 → „1½ Sterne“ */
  function sterneDelta(halbe) {
    const ganz = Math.floor(halbe / 2), halb = halbe % 2 ? "½" : "";
    const zahl = (ganz ? String(ganz) : "") + halb;
    return zahl + (halbe <= 2 ? " Stern" : " Sterne");
  }
  function sage(text) { ansage.textContent = ""; setTimeout(() => { ansage.textContent = text; }, 60); }
  function fokusAufTitel() {
    const h = buehne.querySelector("h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }
  function bildschirm(html, mitKopf) {
    kopf.hidden = !mitKopf;
    buehne.innerHTML = `<div class="bildschirm">${html}</div>`;
    window.scrollTo(0, 0);
    fokusAufTitel();
  }

  /* ---------- Kopf ---------- */
  let angezeigt = { tag: 0, kosten: 0, sterne: 10 };
  function kopfSetzen(stand, s, blitz) {
    const alt = angezeigt;
    angezeigt = { tag: stand.tag, kosten: stand.kosten, sterne: stand.sterne };
    document.getElementById("w-datum").textContent = M.datumKurz(stand.tag);
    zaehlen(document.getElementById("w-kosten"), alt.kosten, stand.kosten, (n) => euroZahl(n));
    document.getElementById("w-sterne").innerHTML = sterneSVG(stand.sterne);
    document.getElementById("w-sterne").setAttribute("aria-label", sterneText(stand.sterne));

    const leiste = document.getElementById("zeitleiste");
    const fuell = leiste.querySelector("i");
    const montiert = s && s.montageTag != null;
    leiste.classList.remove("knapp", "vorbei", "geschafft");
    let anteil = Math.min(stand.tag / M.AUTO_TAG, 1);
    if (montiert && s.montageTag <= M.AUTO_TAG) { leiste.classList.add("geschafft"); anteil = s.montageTag / M.AUTO_TAG; }
    else if (stand.tag > M.AUTO_TAG) leiste.classList.add("vorbei");
    else if (M.AUTO_TAG - stand.tag <= 5) leiste.classList.add("knapp");
    fuell.style.width = (anteil * 100).toFixed(1) + "%";
    const rest = M.AUTO_TAG - stand.tag;
    document.getElementById("w-auto").textContent =
      montiert && s.montageTag <= M.AUTO_TAG ? "Wallbox läuft vor dem Auto" :
      rest > 0 ? `Auto in ${rest} Arbeitstagen` : rest === 0 ? "Auto kommt heute" : "Auto ist da";

    if (blitz && !ruhig) {
      if (stand.kosten > alt.kosten) aufblitzen("a-kosten", "blitz-rot");
      if (stand.sterne < alt.sterne) aufblitzen("a-sterne", "blitz-rot");
      if (stand.sterne > alt.sterne) aufblitzen("a-sterne", "blitz-gruen");
      if (stand.tag > alt.tag) aufblitzen("a-datum", stand.tag > M.AUTO_TAG ? "blitz-rot" : "");
    }
  }
  function aufblitzen(id, klasse) {
    if (!klasse) return;
    const el = document.getElementById(id);
    el.classList.add(klasse);
    setTimeout(() => el.classList.remove(klasse), 650);
  }
  function zaehlen(el, von, bis, format) {
    if (ruhig || von === bis) { el.textContent = format(bis); return; }
    const t0 = performance.now(), dauer = 650;
    function schritt(t) {
      const p = Math.min((t - t0) / dauer, 1);
      const w = Math.round(von + (bis - von) * (1 - Math.pow(1 - p, 3)));
      el.textContent = format(w);
      if (p < 1) requestAnimationFrame(schritt);
    }
    requestAnimationFrame(schritt);
  }
  let gezeichnet = null;
  function leitungZeichnen(s, aktuell) {
    const zustaende = s.segmente.map((g) => g.zustand);
    const neu = gezeichnet ? zustaende.map((z, i) => (z !== gezeichnet[i] && z !== "offen" ? i : -1)).filter((i) => i >= 0) : [];
    gezeichnet = zustaende;
    document.getElementById("leitung").innerHTML = B.leitung(s.segmente, aktuell, ruhig ? [] : neu);
  }

  /* ---------- Ablaufdiagramm ---------- */
  const spaltenName = (id) => M.SPALTEN.find((sp) => sp.id === id).name;
  function ablaufBeschreibung(zeilen) {
    return "Ablaufdiagramm mit den Spalten " + M.SPALTEN.map((sp) => sp.name).join(", ") + ". " +
      zeilen.map((z) => (z.station ? `Station ${z.station} ${z.text}` : z.text) + ` (${spaltenName(z.spalte)})`).join(", danach ") + ".";
  }
  /* Zeilen von der gerade entschiedenen Station bis zur nächsten */
  function wegAbschnitt(zeilen, stationNr) {
    const von = zeilen.findIndex((z) => z.station === stationNr);
    let bis = zeilen.findIndex((z) => z.station === stationNr + 1);
    if (bis < 0) bis = zeilen.length - 1;
    const namen = [];
    for (let i = von; i <= bis; i++) {
      const n = spaltenName(zeilen[i].spalte);
      if (namen[namen.length - 1] !== n) namen.push(n);
    }
    const text = namen.length > 1 ? namen.join(" → ") : `bleibt beim ${namen[0]}`;
    return { von, bis, text };
  }

  /* ---------- Start ---------- */
  function zeigeStart() {
    const s = daten.spiel;
    let knoepfe;
    if (s && s.fertig) {
      knoepfe = `<button class="los" id="ergebnis">Ihr Ergebnis ansehen</button>
        <button class="los zweit" id="neu">Neu beginnen</button>`;
    } else if (s) {
      const st = s.schritt < 8 ? M.STATIONEN[s.schritt] : null;
      knoepfe = `<button class="los" id="weiter">Weiterspielen${st ? `: Station ${st.nr}` : ""}</button>
        <button class="los zweit" id="neu">Neu beginnen</button>`;
    } else {
      knoepfe = `<button class="los" id="neu">Auftrag annehmen</button>`;
    }
    bildschirm(`
      <div class="start">
        <div class="marke">${B.adern()}<span>Elektro Terhorst GmbH, Ibbenbüren</span></div>
        <h1>Wallbox für Frau Brüning</h1>
        <p class="unterzeile">Ein Auftrag geht durch den Betrieb. An jeder Station entscheiden Sie.</p>
        <figure class="held" role="img" aria-label="Haus mit Garage. In der Garage fehlt noch die Wallbox, am 7. Dezember kommt das Auto.">${B.szene("start")}</figure>

        <div class="block">
          <h2>Worum es geht</h2>
          <p>Seit dieser Woche arbeitet Elektro Terhorst nach dem neuen Organigramm. Jetzt kommt ein neuer Auftrag herein: Frau Brüning aus Recke möchte eine Wallbox.</p>
          <p>Sie spielen nacheinander alle, die den Auftrag in die Hand bekommen, vom ersten Anruf bis zur Rechnung.</p>
        </div>

        <div class="block">
          <h2>Der Ablauf bei Terhorst</h2>
          <p>Das Organigramm regelt, wer wofür zuständig ist. Das ist die <b>Aufbauorganisation</b>. In welcher Reihenfolge ein Auftrag von Stelle zu Stelle läuft, regelt die <b>Ablauforganisation</b>.</p>
          <p>Das Ablaufdiagramm zeigt den geplanten Weg dieses Auftrags. Jede Spalte ist eine Stelle aus dem Organigramm, jede Zeile ein Schritt. Wechselt der Auftrag die Spalte, wird er übergeben. Diese Übergaben heißen <b>Schnittstellen</b>.</p>
          <figure class="ablauf" role="img" aria-label="${esc(ablaufBeschreibung(M.ablaufZeilen(null)))}">${B.ablaufdiagramm(M.ablaufZeilen(null), M.SPALTEN)}</figure>
          <p class="bildzeile">Die Spalte Chef bleibt leer: Im geplanten Ablauf kommt er nicht vor. An den nummerierten Stationen entscheiden Sie.</p>
        </div>

        <div class="block">
          <h2>Ihr Ziel</h2>
          <ul class="ziele">
            <li><span class="ic-gross">${B.icon("auto")}</span><span>Die Wallbox läuft, bevor am 7. Dezember das Auto kommt.</span></li>
            <li><span class="ic-gross">${B.icon("euro")}</span><span>Terhorst hat keine Mehrkosten.</span></li>
            <li><span class="ic-gross">${B.icon("stern")}</span><span>Frau Brüning ist zufrieden und vergibt fünf Sterne.</span></li>
          </ul>
        </div>

        <div class="block">
          <h2>So spielen Sie</h2>
          <ul class="regeln">
            <li>${B.icon("weiche")}<span>Sie durchlaufen den Ablauf Station für Station. An jeder Station wählen Sie eine von drei Möglichkeiten. Alle drei kommen in Betrieben wirklich vor.</span></li>
            <li>${B.icon("blitz")}<span>Jede Entscheidung hat Folgen. Manche zeigen sich sofort, manche erst ein paar Stationen später.</span></li>
            <li>${B.icon("stift")}<span>Spielen Sie allein. Am Ende tragen Sie Ihre Bilanz in M2 auf dem Arbeitsblatt ein.</span></li>
          </ul>
        </div>

        <div class="block">
          <h2>Die Farben der Übergaben</h2>
          <p>Oben im Bild läuft der Ablauf als Leitung mit. Jede Übergabe färbt sich, sobald klar ist, wie sie gelaufen ist. Umwege erscheinen im Ablaufdiagramm als zusätzlicher Schritt.</p>
          <ul class="legende">
            <li>${B.segmentIcon("gruen")}<div><b>${M.FARBEN.gruen.name}</b><span>${M.FARBEN.gruen.lang}</span></div></li>
            <li>${B.segmentIcon("gelb")}<div><b>${M.FARBEN.gelb.name}</b><span>${M.FARBEN.gelb.lang}</span></div></li>
            <li>${B.segmentIcon("rot")}<div><b>${M.FARBEN.rot.name}</b><span>${M.FARBEN.rot.lang}</span></div></li>
          </ul>
        </div>

        <div class="knopfreihe">${knoepfe}</div>
        <p class="fussnote">Konstruiertes Fallbeispiel. Betrieb und Personen sind erfunden.</p>
      </div>`, false);

    const neu = document.getElementById("neu");
    neu.addEventListener("click", () => {
      daten.spiel = M.neuesSpiel(Math.random);
      daten.ansicht = "station"; daten.karten = null; daten.sprung = null;
      speichern();
      angezeigt = { tag: 0, kosten: 0, sterne: 10 };
      zeigeAktuell();
    });
    const ergebnis = document.getElementById("ergebnis");
    if (ergebnis) ergebnis.addEventListener("click", () => { daten.ansicht = "ende"; speichern(); zeigeEnde(); });
    const weiter = document.getElementById("weiter");
    if (weiter) weiter.addEventListener("click", () => {
      angezeigt = { tag: daten.spiel.tag, kosten: daten.spiel.kosten, sterne: daten.spiel.sterne };
      if (daten.ansicht === "zeitsprung") daten.ansicht = daten.spiel.schritt >= 8 ? "nachspiel" : "station";
      zeigeAktuell();
    });
  }

  /* ---------- Station ---------- */
  function rollenZeile(rolle, wann, ort) {
    const p = M.PERSONEN[rolle];
    return `<div class="rolle">
      <span class="avatar">${B.avatar(rolle)}</span>
      <div><b>Sie sind ${esc(p.name)}, ${esc(p.stelle)}.</b><span>${esc(wann)}</span><span>${esc(ort)}</span></div>
    </div>`;
  }

  function optionenHTML(ids, quelle, frage, tipp) {
    return `<fieldset class="optionen" id="optionen">
      <legend>${esc(frage)}</legend>
      ${tipp ? `<p class="tipp">${esc(tipp)}</p>` : ""}
      ${ids.map((id, k) => {
        const o = quelle.find((x) => x.id === id);
        const buchstabe = "ABC"[k];
        return `<label class="option" data-id="${id}">
          <input type="radio" name="wahl" value="${id}">
          <span class="klemme" aria-hidden="true"><span class="schraube"></span>${buchstabe}</span>
          <span class="otext"><span class="unterstrich unsichtbar">Möglichkeit ${buchstabe}: </span>${esc(o.text)}</span>
        </label>`;
      }).join("")}
    </fieldset>`;
  }

  function auswahlVerdrahten(beiEntscheidung) {
    const feld = document.getElementById("optionen");
    const knopf = document.getElementById("entscheiden");
    let gewaehlt = null;
    feld.addEventListener("change", (e) => {
      if (feld.classList.contains("gesperrt")) return;
      gewaehlt = e.target.value;
      feld.querySelectorAll(".option").forEach((o) => o.classList.toggle("gewaehlt", o.dataset.id === gewaehlt));
      knopf.disabled = false;
      knopf.textContent = "Entscheiden";
      knopf.parentElement.classList.add("aktiv");
    });
    knopf.addEventListener("click", () => {
      if (!gewaehlt || feld.classList.contains("gesperrt")) return;
      feld.classList.add("gesperrt");
      feld.querySelectorAll("input").forEach((i) => { i.disabled = true; });
      knopf.disabled = true;
      setTimeout(() => beiEntscheidung(gewaehlt), ruhig ? 0 : 280);
    });
  }

  function zeigeStation() {
    const s = daten.spiel;
    const st = M.STATIONEN[s.schritt];
    kopfSetzen({ tag: s.tag, kosten: s.kosten, sterne: s.sterne }, s, false);
    leitungZeichnen(s, s.schritt);
    const wann = `${M.datum(s.tag)}, ${st.uhr}`;
    bildschirm(`
      <div class="station">
        <div class="stationskopf">
          <span class="nr-klemme" aria-hidden="true">${st.nr}</span>
          <div><h1>${esc(st.titel)}</h1><span class="von">Station ${st.nr} von 8</span></div>
        </div>
        ${rollenZeile(st.rolle, wann, st.ort)}
        <details class="ablauf-klapp">
          <summary>Wo steht der Auftrag im Ablauf?</summary>
          <figure class="ablauf" role="img" aria-label="${esc(ablaufBeschreibung(M.ablaufZeilen(s)))}">${B.ablaufdiagramm(M.ablaufZeilen(s), M.SPALTEN)}</figure>
        </details>
        <figure class="szene" role="img" aria-label="${esc(B.beschreibung(st.bild, s))}">${B.szene(st.bild, s)}</figure>
        <p class="situation">${esc(st.situation(s))}</p>
        ${optionenHTML(s.reihenfolge[s.schritt], st.optionen, st.frage)}
        <div class="klebt"><button class="los" id="entscheiden" disabled>Wählen Sie eine Möglichkeit</button></div>
      </div>`, true);
    sage(`Station ${st.nr}: ${st.titel}. Sie sind ${M.PERSONEN[st.rolle].name}.`);
    auswahlVerdrahten((id) => {
      const vorher = { tag: s.tag, kosten: s.kosten, sterne: s.sterne };
      const r = M.entscheiden(s, id);
      daten.karten = r.karten;
      daten.sprung = { von: r.vonTag, bis: r.bisTag, station: st.nr, wahl: st.optionen.find((o) => o.id === id).text, vorher };
      daten.ansicht = "zeitsprung";
      speichern();
      zeigeZeitsprung(true);
    });
  }

  /* ---------- Zeitsprung mit Folgen ---------- */
  function deltaChips(k) {
    const chips = [];
    const tage = k.art === "ergebnis" ? k.verzug : k.delta.tage;
    if (tage > 0) chips.push(`<span class="chip wert schlecht">${B.icon("kalender")}+${tageWort(tage)} Verzug</span>`);
    if (tage < 0) chips.push(`<span class="chip wert">${B.icon("kalender")}${tageWort(-tage)} schneller</span>`);
    if (k.delta.kosten > 0) chips.push(`<span class="chip wert schlecht">${B.icon("euro")}+${euroZahl(k.delta.kosten)} Mehrkosten</span>`);
    if (k.delta.sterne) chips.push(`<span class="chip wert ${k.delta.sterne < 0 ? "schlecht" : "gut"}">${B.icon("stern")}${k.delta.sterne < 0 ? "−" : "+"}${sterneDelta(Math.abs(k.delta.sterne))}</span>`);
    return chips.join("");
  }
  function farbChip(farbe) {
    if (farbe === "wartet") return `<span class="chip wartet">${B.icon("uhr")}Zeigt sich später</span>`;
    return `<span class="chip ${farbe}">${B.punkt(farbe)}${M.FARBEN[farbe].name}</span>`;
  }
  function karteHTML(k) {
    let titel, klasse = k.farbe, icon = B.segmentIcon(k.farbe), zusatz = "";
    if (k.art === "ergebnis") {
      titel = esc(k.titel);
      if (k.farbe === "wartet") zusatz = `<p class="leise" style="margin-top:8px;font-size:15px">${esc(k.wartetText || "")}</p>`;
    } else if (k.art === "pruefung") {
      const st = M.STATIONEN[k.station - 1];
      titel = `<span class="rueck" style="color:var(--tinte-2)">Jetzt zeigt sich</span>Station ${st.nr}: ${esc(st.titel)}`;
    } else if (k.art === "folge") {
      const st = M.STATIONEN[k.station - 1];
      titel = `<span class="rueck">Folge von Station ${st.nr}</span>${esc(st.titel)}`;
      klasse = "rot folge";
      icon = B.segmentIcon("rot");
    } else {
      titel = "Das Auto ist da";
      klasse = "rot folge";
      icon = B.icon("auto", "karte-auto");
    }
    const fuss = (k.art === "ergebnis" || k.art === "pruefung" ? farbChip(k.farbe) : "") + deltaChips(k);
    return `<li class="karte ${klasse}">
      <div class="karte-kopf">${icon}<h3>${titel}</h3></div>
      <p>${esc(k.text)}</p>${zusatz}
      ${fuss ? `<div class="karte-fuss">${fuss}</div>` : ""}
    </li>`;
  }

  function kalenderBlatt(tag) {
    const k = M.kalender(tag);
    return `<div class="blatt"><span class="wt">${k.wtLang}</span><span class="zahl">${k.tag}</span><span class="mon">${k.monLang}</span></div>`;
  }

  function zeigeZeitsprung(frisch) {
    const s = daten.spiel;
    const sp = daten.sprung;
    const karten = daten.karten || [];
    const n = sp.bis - sp.von;
    const naechste = s.schritt < 8 ? M.STATIONEN[s.schritt] : null;
    const spanne = n === 0 ? "Am selben Tag" : n === 1 ? "Einen Arbeitstag später" : `${n} Arbeitstage später`;
    const weiterText = naechste ? `Weiter zu Station ${naechste.nr}: ${naechste.titel}` : "Weiter: Post von Frau Brüning";
    const seg = sp.station - 1;
    const weg = wegAbschnitt(M.ablaufZeilen(s), sp.station);
    /* vor dem Aufdecken: Übergabe dieser Station noch offen */
    function ausschnittSVG(fertig, animiert) {
      const stand = fertig ? s : Object.assign({}, s, { segmente: s.segmente.map((g, j) => (j === seg ? { zustand: "offen" } : g)) });
      const zeilen = M.ablaufZeilen(stand);
      const w = wegAbschnitt(zeilen, sp.station);
      return B.ablaufdiagramm(zeilen, M.SPALTEN, { ausschnitt: [w.von, w.bis], neu: animiert ? [seg] : [] });
    }

    /* Kopf zeigt erst den Stand vor der Entscheidung, dann Karte für Karte */
    const vorher = sp.vorher || { tag: sp.von, kosten: angezeigt.kosten, sterne: angezeigt.sterne };
    angezeigt = Object.assign({}, vorher);
    kopfSetzen(vorher, Object.assign({}, s, { montageTag: null }), false);
    leitungZeichnen(Object.assign({}, s, { segmente: s.segmente.map((g, i) => (i === sp.station - 1 ? { zustand: "offen" } : g)) }), sp.station - 1);

    bildschirm(`
      <div class="zeitsprung">
        <div class="zeitsprung-kopf">
          <div class="abreiss" aria-hidden="true"><span class="rumpf"></span><span class="ringe"><i></i><i></i></span><div id="blaetter">${kalenderBlatt(sp.bis)}</div></div>
          <div>
            <h1 class="spanne">${spanne}</h1>
            <p class="wann">${esc(M.datum(sp.bis))}</p>
          </div>
        </div>
        <div class="ablauf-schritt">
          <p class="ablauf-titel"><b>Im Ablauf:</b> ${esc(weg.text)}</p>
          <figure class="ablauf" id="ablauf-ausschnitt" role="img" aria-label="${esc("Ausschnitt aus dem Ablaufdiagramm: " + weg.text)}">${ausschnittSVG(false)}</figure>
        </div>
        <div class="ihre-wahl"><span>Ihre Entscheidung an Station ${sp.station}</span><p>${esc(sp.wahl)}</p></div>
        <ol class="karten" id="karten">${karten.map(karteHTML).join("")}</ol>
        <div class="klebt" id="weiter-rahmen" ${frisch && !ruhig ? "hidden" : ""}><button class="los" id="weiter">${esc(weiterText)}</button></div>
      </div>`, true);
    document.getElementById("weiter").addEventListener("click", () => {
      daten.ansicht = s.schritt >= 8 ? "nachspiel" : "station";
      daten.karten = null;
      speichern();
      zeigeAktuell();
    });

    const kartenEls = Array.from(document.querySelectorAll("#karten .karte"));
    const alleZeigen = () => {
      document.getElementById("ablauf-ausschnitt").innerHTML = ausschnittSVG(true, false);
      kartenEls.forEach((el) => el.classList.remove("verborgen"));
      const letzte = karten[karten.length - 1];
      if (letzte) kopfSetzen(letzte.stand, s, false);
      leitungZeichnen(s, s.schritt < 8 ? s.schritt : 8);
      document.getElementById("weiter-rahmen").hidden = false;
    };
    if (!frisch || ruhig) { alleZeigen(); sage(spanne + ". " + karten.map((k) => k.text).join(" ")); return; }

    kartenEls.forEach((el) => el.classList.add("verborgen"));
    /* Kalender abreißen: ein Blatt je Arbeitstag, höchstens zehn */
    const stapel = document.getElementById("blaetter");
    const schritte = Math.min(n, 10);
    const tage = [];
    for (let i = 0; i < schritte; i++) tage.push(sp.bis - schritte + i);
    stapel.innerHTML = kalenderBlatt(sp.bis) + tage.map((t) => kalenderBlatt(t)).join("");
    const blaetter = Array.from(stapel.querySelectorAll(".blatt")).slice(1).reverse(); /* oben liegt der früheste Tag */
    blaetter.forEach((b, i) => { b.style.zIndex = 2 + i; });
    const obersteZuerst = blaetter.slice().reverse();
    let t = 250;
    obersteZuerst.forEach((b, i) => {
      setTimeout(() => {
        b.classList.add("weg");
        kopfSetzen({ tag: Math.min(sp.von + i + 1, sp.bis), kosten: angezeigt.kosten, sterne: angezeigt.sterne }, Object.assign({}, s, { montageTag: null }), false);
      }, t);
      t += schritte > 6 ? 120 : 180;
    });
    t += 250;
    /* Karten nacheinander, Kopf zieht mit */
    let leitungFertig = false;
    kartenEls.forEach((el, i) => {
      setTimeout(() => {
        el.classList.remove("verborgen");
        el.classList.add("zeigen");
        const k = karten[i];
        kopfSetzen(k.stand, i === kartenEls.length - 1 ? s : Object.assign({}, s, { montageTag: k.art === "auto" ? s.montageTag : null }), true);
        if (k.art === "ergebnis") document.getElementById("ablauf-ausschnitt").innerHTML = ausschnittSVG(true, true);
        if (!leitungFertig && (k.art === "ergebnis")) {
          leitungZeichnen(Object.assign({}, s, { segmente: s.segmente.map((g, j) => (pruefungSpaeter(karten, i, j) ? Object.assign({}, g, { zustand: "wartet" }) : g)) }), s.schritt < 8 ? s.schritt : 8);
        }
        if (i === kartenEls.length - 1) { leitungFertig = true; leitungZeichnen(s, s.schritt < 8 ? s.schritt : 8); }
        if (i > 0) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, t);
      t += 700;
    });
    setTimeout(() => {
      document.getElementById("weiter-rahmen").hidden = false;
      sage(spanne + ". " + karten.map((k) => k.text).join(" "));
    }, t - 200);
  }
  /* Eine Prüfkarte deckt eine frühere Station erst auf, wenn sie erscheint */
  function pruefungSpaeter(karten, gezeigtBis, segmentIndex) {
    return karten.some((k, idx) => idx > gezeigtBis && k.art === "pruefung" && k.station - 1 === segmentIndex);
  }

  /* ---------- Nachspiel ---------- */
  function zeigeNachspiel() {
    const s = daten.spiel;
    const n = s.nachspiel;
    kopfSetzen({ tag: s.tag, kosten: s.kosten, sterne: s.sterne }, s, false);
    leitungZeichnen(s, 8);
    const tagNach = s.tag + 1;
    if (n.art === "lob") {
      bildschirm(`
        <div class="station">
          <div class="stationskopf"><span class="nr-klemme" aria-hidden="true">${B.icon("haken")}</span><div><h1>Post von Frau Brüning</h1><span class="von">${esc(M.datum(tagNach))}</span></div></div>
          <figure class="szene" role="img" aria-label="Ein Smartphone zeigt eine neue Bewertung.">${B.szene("nachspiel", s)}</figure>
          <p class="situation">Eine Woche nach der Rechnung schreibt Frau Brüning eine Bewertung im Internet.</p>
          ${bewertungHTML(s.sterne, n.saetze.join(" ") + " Gerne wieder.")}
          <div class="klebt"><button class="los" id="weiter">Zur Bilanz</button></div>
        </div>`, true);
      document.getElementById("weiter").addEventListener("click", () => {
        M.lobAbschliessen(s);
        abschliessen();
      });
      return;
    }
    bildschirm(`
      <div class="station">
        <div class="stationskopf"><span class="nr-klemme" aria-hidden="true">!</span><div><h1>Post von Frau Brüning</h1><span class="von">Nachspiel</span></div></div>
        ${rollenZeile("bernd", `${M.datum(tagNach)}, 8:05 Uhr`, "Büro")}
        <div class="mail">
          <div class="mail-kopf"><span>Von: <b>Sabine Brüning</b></span><span>Betreff: <b>Meine Wallbox</b></span></div>
          <div class="mail-text">
            <p>Sehr geehrter Herr Terhorst,</p>
            <p>die Wallbox läuft. Zufrieden bin ich trotzdem nicht.</p>
            ${n.saetze.map((t) => `<p>${esc(t)}</p>`).join("")}
            <p>Von einem Fachbetrieb hatte ich mehr erwartet. Ich überlege, eine Bewertung zu schreiben.</p>
            <p>Sabine Brüning</p>
          </div>
        </div>
        ${optionenHTML(s.reihenfolge[8], M.NACHSPIEL.optionen, M.NACHSPIEL.frage)}
        <div class="klebt"><button class="los" id="entscheiden" disabled>Wählen Sie eine Möglichkeit</button></div>
      </div>`, true);
    auswahlVerdrahten((id) => {
      M.nachspielEntscheiden(s, id);
      daten.ansicht = "nachspiel-ergebnis";
      speichern();
      zeigeNachspielErgebnis(true);
    });
  }

  function bewertungHTML(halbe, text) {
    return `<div class="bewertung">
      <div class="wer"><span class="avatar">${B.avatar("bruening")}</span><div><b>Sabine Brüning</b><span>Bewertung für Elektro Terhorst GmbH</span></div></div>
      <div class="sterne" aria-label="${sterneText(halbe)}">${sterneSVG(halbe)}</div>
      <blockquote>„${esc(text)}“</blockquote>
    </div>`;
  }

  function zeigeNachspielErgebnis(frisch) {
    const s = daten.spiel;
    const n = s.nachspiel;
    kopfSetzen({ tag: s.tag, kosten: s.kosten, sterne: s.sterne }, s, !!frisch);
    bildschirm(`
      <div class="station">
        <div class="stationskopf"><span class="nr-klemme" aria-hidden="true">!</span><div><h1>Die Antwort von Frau Brüning</h1><span class="von">Nachspiel</span></div></div>
        <p class="situation">${esc(n.text2)}</p>
        ${bewertungHTML(s.sterne, n.bewertung)}
        <div class="klebt"><button class="los" id="weiter">Zur Bilanz</button></div>
      </div>`, true);
    document.getElementById("weiter").addEventListener("click", abschliessen);
  }

  function abschliessen() {
    const s = daten.spiel;
    s.fertig = true;
    daten.ansicht = "ende";
    speichern();
    zeigeEnde();
  }

  /* ---------- Ende: Bilanz und Leitung ---------- */
  function zeigeEnde() {
    const s = daten.spiel;
    const b = M.bilanz(s);
    const best = 14;
    const autoZeile = s.autoOhneWallbox > 0
      ? `Das Auto stand ${M.tageText(s.autoOhneWallbox)} ohne Wallbox in der Garage.`
      : `Die Wallbox lief ${M.tageText(s.wallboxVorAuto)} vor dem Auto.`;
    const gewinnZeile = b.gewinn >= 0
      ? `Vom geplanten Gewinn (${euroZahl(M.GEWINN_GEPLANT)}) bleiben ${euroZahl(b.gewinn)}.`
      : `Geplant waren ${euroZahl(M.GEWINN_GEPLANT)} Gewinn. Jetzt macht Terhorst ${euroZahl(-b.gewinn)} Verlust.`;

    const kette = s.segmente.map((g, i) => {
      const st = M.STATIONEN[i];
      const letzte = i === 7;
      return `<li>
        <div class="knoten"><span class="nr">${st.nr}</span>${B.segmentSenkrecht(g.farbe)}</div>
        <span class="avatar">${B.avatar(st.rolle)}</span>
        <div class="was"><b>${esc(st.titel)}</b><span>${esc(g.kurz)}</span>${farbChip(g.farbe)}${g.nachwirkung ? `<span class="nachher">Mit Folgen an späteren Stationen</span>` : ""}</div>
      </li>`;
    }).join("") + `<li class="ende-knoten"><div class="knoten"><span class="nr">${B.icon("haken")}</span></div><span></span><div class="was"><b>Auftrag abgeschlossen</b></div></li>`;

    const bewertung = s.nachspiel && s.nachspiel.art === "beschwerde" ? s.nachspiel.bewertung : (s.nachspiel ? s.nachspiel.saetze.join(" ") + " Gerne wieder." : "");

    bildschirm(`
      <div class="ende">
        <div class="stationskopf"><span class="nr-klemme" aria-hidden="true">${B.icon("haken")}</span><div><h1>Auftrag abgeschlossen</h1><span class="von">Wallbox für Frau Brüning</span></div></div>
        <figure class="szene" role="img" aria-label="${esc(B.beschreibung("ende", s))}">${B.szene("ende", s)}</figure>

        <ul class="bilanz">
          <li><span class="ic-gross">${B.icon("kalender")}</span><div><b>${b.tage} Arbeitstage</b><span>von der Anfrage bis zur Rechnung. Ohne Umwege geht es in ${best}. ${esc(autoZeile)}</span></div></li>
          <li><span class="ic-gross">${B.icon("euro")}</span><div><b>${euroZahl(b.kosten)} Mehrkosten</b><span>${esc(gewinnZeile)}</span></div></li>
          <li><span class="ic-gross">${B.icon("stern")}</span><div><div class="sterne" aria-label="${sterneText(s.sterne)}">${sterneSVG(s.sterne)}</div><span>${sterneText(s.sterne)} von Frau Brüning</span></div></li>
        </ul>

        <div class="block">
          <h2>Ihr Ablauf</h2>
          <figure class="ablauf" role="img" aria-label="${esc(ablaufBeschreibung(M.ablaufZeilen(s)))}">${B.ablaufdiagramm(M.ablaufZeilen(s), M.SPALTEN)}</figure>
          <h3 class="zwischen">Station für Station</h3>
          <p class="leise" style="font-size:15.5px">Grün ${b.zaehl.gruen}, gelb ${b.zaehl.gelb}, rot ${b.zaehl.rot}.</p>
          <ol class="kette">${kette}</ol>
        </div>

        ${bewertung ? `<div class="block"><h2>Die Bewertung</h2>${bewertungHTML(s.sterne, bewertung)}</div>` : ""}

        <div class="protokoll">
          <h2>Für Ihr Arbeitsblatt</h2>
          <ol>
            <li>Tragen Sie unter M2 Ihre Bilanz ein: Arbeitstage, Mehrkosten und Sterne.</li>
            <li>Sehen Sie sich oben „Station für Station“ an: Wo ist bei Ihnen etwas verloren gegangen?</li>
          </ol>
        </div>

        <div class="knopfreihe">
          <button class="los zweit" id="startseite">Zur Startseite</button>
        </div>
      </div>`, false);
    document.getElementById("startseite").addEventListener("click", () => zeigeStart());
  }

  /* ---------- Steuerung ---------- */
  function zeigeAktuell() {
    const s = daten.spiel;
    if (!s) return zeigeStart();
    switch (daten.ansicht) {
      case "station": return s.schritt < 8 ? zeigeStation() : zeigeNachspiel();
      case "zeitsprung": return daten.karten ? zeigeZeitsprung(false) : (s.schritt < 8 ? zeigeStation() : zeigeNachspiel());
      case "nachspiel": return zeigeNachspiel();
      case "nachspiel-ergebnis": return zeigeNachspielErgebnis(false);
      case "ende": return zeigeEnde();
      default: return zeigeStart();
    }
  }

  laden();
  /* Beim Öffnen immer erst die Startseite: dort geht es weiter, zum Ergebnis oder neu los */
  zeigeStart();
  window.__spiel = { daten: () => daten, zeigeAktuell };
})();

</script>
</body>
</html>
