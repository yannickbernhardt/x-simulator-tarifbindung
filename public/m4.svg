<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="14" fill="#DCE9EF"/>
  <text x="60" y="78" font-size="44" fill="#111">Weniger Tarifbindung und Mitbestimmung</text>
  <text x="60" y="122" font-size="28" fill="#222">Von allen <tspan font-weight="700">Beschäftigten</tspan> hatten …</text>

  <!-- 2000 -->
  <text x="260" y="192" font-size="30" font-weight="700" text-anchor="middle" fill="#111">2000</text>
  <rect x="150" y="210" width="220" height="220" fill="#BDBAAA"/>
  <rect x="150" y="430" width="220" height="112.7" fill="#4F8084"/>
  <rect x="150" y="542.7" width="220" height="29.4" fill="#5A98BF"/>
  <rect x="150" y="572.1" width="220" height="127.9" fill="#A8266A"/>
  <g fill="#fff" font-weight="700" text-anchor="middle">
    <text x="260" y="330" font-size="32">45 %</text>
    <text x="260" y="497" font-size="32">23 %</text>
    <text x="260" y="566" font-size="24">6 %</text>
    <text x="260" y="650" font-size="44">26 %</text>
  </g>

  <!-- 2022 -->
  <text x="940" y="192" font-size="30" font-weight="700" text-anchor="middle" fill="#111">2022</text>
  <rect x="830" y="210" width="220" height="171.5" fill="#BDBAAA"/>
  <rect x="830" y="381.5" width="220" height="78.4" fill="#4F8084"/>
  <rect x="830" y="459.9" width="220" height="39.2" fill="#5A98BF"/>
  <rect x="830" y="499.1" width="220" height="200.9" fill="#A8266A"/>
  <g fill="#fff" font-weight="700" text-anchor="middle">
    <text x="940" y="306" font-size="32">35 %</text>
    <text x="940" y="432" font-size="32">16 %</text>
    <text x="940" y="488" font-size="26">8 %</text>
    <text x="940" y="616" font-size="44">41 %</text>
  </g>

  <!-- Legende in der Mitte -->
  <g font-size="30">
    <text x="425" y="300" fill="#8F8B78">einen Betriebsrat und</text>
    <text x="425" y="338" fill="#8F8B78">einen Tarifvertrag</text>
    <text x="425" y="455" fill="#4F8084">nur einen Tarifvertrag</text>
    <text x="425" y="530" fill="#4A89B2">nur einen Betriebsrat</text>
    <text x="425" y="608" fill="#A8266A">weder Betriebsrat</text>
    <text x="425" y="646" fill="#A8266A">noch Tarifvertrag</text>
  </g>

  <line x1="60" y1="700" x2="1140" y2="700" stroke="#666" stroke-width="2"/>
  <text x="60" y="745" font-size="22" fill="#333">Quelle: Malte Lübker/Thorsten Schulten: Tarifbindung in den Bundesländern.</text>
  <text x="60" y="775" font-size="22" fill="#333">Entwicklungslinien und Auswirkungen auf die Beschäftigten, Düsseldorf 2024 (Hans-Böckler-Stiftung)</text>
</svg>
