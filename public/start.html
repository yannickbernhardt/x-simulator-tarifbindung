<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>X</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/x.css">
<style>
  body { min-height: 100dvh; display: flex; justify-content: center; }
  main {
    width: 100%; max-width: 440px; min-height: 100dvh; display: flex; flex-direction: column;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .logo .ic { width: 44px; height: 44px; }
  h1 { font-size: 40px; line-height: 46px; font-weight: 800; margin: 48px 0 12px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 17px; margin: 0 0 32px; }
  .fld {
    position: relative; border: 1px solid var(--border-input); border-radius: 4px; height: 58px; margin-bottom: 8px;
  }
  .fld:focus-within { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .fld.err { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .fld.err label, .fld.err:focus-within label { color: var(--red); }
  .fld label { position: absolute; left: 8px; top: 17px; color: var(--muted); font-size: 17px; pointer-events: none; transition: all 0.15s; }
  .fld.filled label, .fld:focus-within label { top: 8px; font-size: 13px; line-height: 16px; }
  .fld:focus-within label { color: var(--blue); }
  .fld input {
    position: absolute; left: 0; right: 0; bottom: 0; height: 36px; padding: 0 8px 8px; border: 0; outline: 0;
    background: transparent; color: var(--text); font: inherit; font-size: 17px; text-transform: lowercase;
  }
  .err-text { color: var(--red); font-size: 13px; min-height: 18px; margin: 0 0 16px 8px; }
  .fuss { margin-top: auto; color: var(--muted); font-size: 13px; line-height: 16px; }
  .fuss b { color: var(--text); }
</style>
</head>
<body>
<main>
  <span class="logo" id="logo" aria-label="X"></span>
  <h1>Tritt deiner Klasse bei</h1>
  <p class="sub">Gib den Code ein, den deine Lehrkraft dir gegeben hat – oder scanne den QR-Code.</p>
  <form id="form" autocomplete="off">
    <div class="fld" id="fCode">
      <label for="inCode">Raumcode</label>
      <input id="inCode" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </div>
    <p class="err-text" id="err"></p>
    <button class="pill pill-inv pill-lg" id="los" disabled>Weiter</button>
  </form>
  <p class="fuss"><b>Unterrichtssimulation – kein echtes X.</b> Posts sieht nur deine Klasse und die Lehrkraft; sie werden nach 14 Tagen automatisch gelöscht.</p>
</main>
<script type="module">
import { icon } from "/x.js";

const $ = (s) => document.querySelector(s);
try { if (localStorage.getItem("xsim.theme") === '"light"') document.documentElement.dataset.theme = "light"; } catch {}
$("#logo").innerHTML = icon("logo");

const inp = $("#inCode");
const code = () => inp.value.trim().toLowerCase().replace(/\s+/g, "");
inp.addEventListener("input", () => {
  $("#fCode").classList.toggle("filled", !!inp.value);
  $("#fCode").classList.remove("err");
  $("#err").textContent = "";
  $("#los").disabled = code().length < 3;
});
inp.focus();

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const c = code();
  if (!/^[a-z0-9][a-z0-9-]{2,19}$/.test(c)) return zeigeFehler("Diesen Code gibt es nicht.");
  $("#los").disabled = true;
  try {
    const r = await fetch(`/api/r/${encodeURIComponent(c)}/state`);
    if (r.status === 404) return zeigeFehler("Diesen Code gibt es nicht. Prüfe ihn noch einmal.");
    if (r.status === 423) return zeigeFehler("Dieser Raum ist gerade geschlossen.");
    location.href = `/r/${encodeURIComponent(c)}`;
  } catch {
    zeigeFehler("Keine Verbindung. Versuch es gleich noch einmal.");
  }
});

function zeigeFehler(t) {
  $("#fCode").classList.add("err");
  $("#err").textContent = t;
  $("#los").disabled = false;
}
</script>
</body>
</html>
